name: Deploy APEX to GitHub Pages

# Manual trigger only. The simplest way to publish needs NO workflow:
#   Repo → Settings → Pages → Source: "Deploy from a branch" → this branch → /(root) → Save.
# Use this workflow only if you prefer the "GitHub Actions" Pages source:
#   enable it (Settings → Pages → Source: GitHub Actions), then run this
#   (Actions tab → Deploy APEX to GitHub Pages → Run workflow).

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
