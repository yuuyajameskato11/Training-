<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0a0e14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="APEX" />
  <title>APEX — Performance Journal</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand"><span class="logo">▲</span> APEX</div>
      <div id="phasePill" class="phase-pill" role="button" tabindex="0">Phase —</div>
    </header>

    <main id="view"><!-- rendered by ui.js --></main>

    <nav id="tabbar">
      <button class="tab" data-tab="today">   <span class="ic">◎</span><span>Today</span></button>
      <button class="tab" data-tab="log">      <span class="ic">✎</span><span>Log</span></button>
      <button class="tab" data-tab="progress"> <span class="ic">▲</span><span>Progress</span></button>
      <button class="tab" data-tab="coach">    <span class="ic">✦</span><span>Coach</span></button>
      <button class="tab" data-tab="settings"> <span class="ic">⚙</span><span>You</span></button>
    </nav>
  </div>

  <div id="modalRoot"></div>

  <script src="js/data.js"></script>
  <script src="js/program.js"></script>
  <script src="js/store.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/coach.js"></script>
  <script src="js/notionsync.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
