<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0a0e14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="APEX" />
  <title>APEX — Performance Journal</title>
  <style>
/* ============================================================================
   APEX — dark, athletic, WHOOP-inspired. Mobile-first, safe-area aware.
   ========================================================================== */
:root{
  --bg:#0a0e14; --bg2:#111722; --card:#151c28; --card2:#1b2432;
  --line:#232d3d; --txt:#eef2f8; --muted:#8b96a8; --muted2:#5c6779;
  --green:#3ddc84; --amber:#ffb020; --red:#ff4d5e; --blue:#4da6ff;
  --accent:#00e0b8; --accent2:#7b6cff;
  --radius:18px; --radius-sm:12px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
  font-size:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior-y:none; -webkit-font-smoothing:antialiased;
}
#app{display:flex;flex-direction:column;min-height:100%;max-width:560px;margin:0 auto}

/* Top bar */
#topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--safe-top) + 12px) 18px 12px;
  background:linear-gradient(180deg,var(--bg) 70%,transparent);
  backdrop-filter:blur(8px);
}
.brand{font-weight:800;letter-spacing:.14em;font-size:1.05rem}
.brand .logo{color:var(--accent);margin-right:4px}
.phase-pill{
  background:var(--card2);border:1px solid var(--line);color:var(--muted);
  padding:6px 12px;border-radius:999px;font-size:.75rem;font-weight:600;cursor:pointer;
}

/* Views */
#view{flex:1;padding:4px 16px 96px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Tab bar */
#tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  display:flex;max-width:560px;margin:0 auto;
  padding:6px 6px calc(var(--safe-bot) + 6px);
  background:rgba(12,16,23,.92);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
}
.tab{
  flex:1;background:none;border:0;color:var(--muted2);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 0;font-size:.66rem;font-weight:600;cursor:pointer;transition:color .15s;
}
.tab .ic{font-size:1.15rem;line-height:1}
.tab.active{color:var(--accent)}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;margin:14px 0}
.card.tight{padding:14px}
.card h3{margin:0 0 4px;font-size:.95rem}
.card .sub{color:var(--muted);font-size:.8rem;margin:0 0 12px}
.section-title{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted2);font-weight:700;margin:22px 4px 2px}

/* Readiness ring */
.ring-wrap{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px}
.ring{position:relative;width:210px;height:210px}
.ring svg{transform:rotate(-90deg)}
.ring .score{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center}
.ring .score .num{font-size:3.6rem;font-weight:800;line-height:1;letter-spacing:-.03em}
.ring .score .lbl{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.ring .score .band{font-size:.8rem;font-weight:700;margin-top:8px;padding:3px 12px;border-radius:999px}
.band-green{color:var(--green);background:rgba(61,220,132,.12)}
.band-amber{color:var(--amber);background:rgba(255,176,32,.12)}
.band-red{color:var(--red);background:rgba(255,77,94,.12)}

/* Headline call */
.call{border-radius:var(--radius);padding:16px 18px;margin:6px 0 2px;border:1px solid var(--line)}
.call.green{background:linear-gradient(135deg,rgba(61,220,132,.14),rgba(61,220,132,.03));border-color:rgba(61,220,132,.3)}
.call.amber{background:linear-gradient(135deg,rgba(255,176,32,.14),rgba(255,176,32,.03));border-color:rgba(255,176,32,.3)}
.call.red{background:linear-gradient(135deg,rgba(255,77,94,.14),rgba(255,77,94,.03));border-color:rgba(255,77,94,.3)}
.call .h{font-weight:800;font-size:1.05rem;margin-bottom:8px}
.call ul{margin:0;padding-left:18px}
.call li{margin:5px 0;color:var(--txt);font-size:.9rem;line-height:1.4}

/* Component bars */
.comp{display:flex;align-items:center;gap:10px;margin:10px 0}
.comp .name{width:104px;font-size:.8rem;color:var(--muted);flex-shrink:0}
.comp .bar{flex:1;height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.comp .bar > i{display:block;height:100%;border-radius:99px}
.comp .val{width:30px;text-align:right;font-size:.8rem;font-weight:700}
.comp .note{font-size:.72rem;color:var(--muted2);margin:-4px 0 8px 114px}

/* Recovery chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:99px;
  padding:8px 12px;font-size:.8rem;color:var(--txt);display:flex;gap:8px;align-items:center;cursor:pointer}
.chip.done{border-color:var(--green);color:var(--green);background:rgba(61,220,132,.08)}
.chip .box{width:15px;height:15px;border:1.5px solid var(--muted2);border-radius:5px;display:inline-block}
.chip.done .box{background:var(--green);border-color:var(--green)}

/* Forms */
.field{margin:14px 0}
.field label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:8px;font-weight:600}
input,select,textarea{
  width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);
  border-radius:var(--radius-sm);padding:12px 14px;font-size:1rem;font-family:inherit;
}
input:focus,select,textarea:focus{outline:none;border-color:var(--accent)}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:10px}
.row > *{flex:1}

/* Segmented 1–5 scale */
.scale{display:flex;gap:6px}
.scale button{flex:1;background:var(--bg2);border:1px solid var(--line);color:var(--muted);
  padding:12px 0;border-radius:10px;font-weight:700;font-size:1rem;cursor:pointer}
.scale button.sel{background:var(--accent);color:#04110d;border-color:var(--accent)}
.scale.inv button.sel{background:var(--amber);color:#1a1200;border-color:var(--amber)}

/* Buttons */
.btn{display:block;width:100%;text-align:center;background:var(--accent);color:#04110d;
  border:0;border-radius:var(--radius-sm);padding:15px;font-size:1rem;font-weight:800;cursor:pointer;margin-top:8px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.btn.sm{padding:10px;font-size:.85rem;width:auto}
.btn:active{transform:scale(.99)}
.btn-row{display:flex;gap:10px}.btn-row .btn{margin-top:0}

/* Stat / metric rows */
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.stat-row:last-child{border-bottom:0}
.stat-row .l{font-size:.9rem}
.stat-row .l small{display:block;color:var(--muted2);font-size:.72rem}
.stat-row .r{text-align:right;font-weight:700}
.stat-row .r small{display:block;font-weight:500;color:var(--muted);font-size:.72rem}
.pos{color:var(--green)} .neg{color:var(--red)} .flat{color:var(--muted)}

/* Goal cards */
.goal{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0}
.goal .top{display:flex;justify-content:space-between;align-items:baseline}
.goal .top .name{font-weight:800;font-size:1.05rem}
.goal .top .tgt{color:var(--muted);font-size:.8rem}
.goal .now{font-size:2rem;font-weight:800;letter-spacing:-.02em;margin:6px 0 2px}
.goal .prog{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.goal .prog > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.goal .eta{font-size:.82rem;color:var(--muted)}
.goal .limiters{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.goal .limiters span{font-size:.68rem;color:var(--muted2);background:var(--bg2);padding:3px 8px;border-radius:99px}

/* Exercise / set log */
.exline{background:var(--card2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;margin:10px 0}
.exline .exhead{display:flex;justify-content:space-between;align-items:center}
.exline .exhead .nm{font-weight:700;font-size:.92rem}
.exline .exhead .ct{font-size:.66rem;color:var(--muted2);text-transform:uppercase;letter-spacing:.08em}
.setline{display:flex;gap:6px;align-items:center;margin-top:8px}
.setline input{padding:9px 8px;font-size:.85rem;text-align:center}
.setline .idx{width:22px;color:var(--muted2);font-size:.8rem;font-weight:700}
.setadvice{font-size:.78rem;color:var(--accent);margin-top:8px;line-height:1.4;
  background:rgba(0,224,184,.06);border-radius:8px;padding:8px 10px}
.setadvice.warn{color:var(--red);background:rgba(255,77,94,.07)}

/* Coach feed */
.coach-msg{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:12px;padding:14px 16px;margin:12px 0}
.coach-msg .who{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px}
.coach-msg p{margin:6px 0;font-size:.9rem;line-height:1.5}
.coach-msg strong{color:var(--txt)}

/* Weekly compliance */
.comp-item{display:flex;align-items:center;gap:10px;margin:12px 0}
.comp-item .cl{width:110px;font-size:.82rem;color:var(--muted)}
.comp-item .cbar{flex:1;height:10px;background:var(--card2);border-radius:99px;position:relative;overflow:hidden}
.comp-item .cbar > i{display:block;height:100%;border-radius:99px}
.comp-item .cv{width:78px;text-align:right;font-size:.78rem;font-weight:700}
.tag{font-size:.62rem;padding:2px 7px;border-radius:99px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.tag.on{color:var(--green);background:rgba(61,220,132,.12)}
.tag.under{color:var(--amber);background:rgba(255,176,32,.12)}
.tag.over{color:var(--red);background:rgba(255,77,94,.12)}

/* Modal */
#modalRoot:empty{display:none}
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);
  display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:22px 22px 0 0;
  width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:20px 18px calc(var(--safe-bot) + 24px);
  animation:slideup .25s ease}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.modal h3{margin:0 0 14px}
.modal .grab{width:40px;height:4px;background:var(--muted2);border-radius:99px;margin:0 auto 16px;opacity:.5}

/* Misc */
.muted{color:var(--muted)}.small{font-size:.8rem}.center{text-align:center}
.empty{text-align:center;color:var(--muted2);padding:40px 20px;font-size:.9rem}
.hr{height:1px;background:var(--line);margin:16px 0;border:0}
.pickgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.pickgrid button{background:var(--card2);border:1px solid var(--line);color:var(--txt);
  padding:12px 10px;border-radius:10px;text-align:left;font-size:.82rem;cursor:pointer}
.pickgrid button small{display:block;color:var(--muted2);font-size:.66rem;margin-top:2px}
.spark{display:flex;align-items:flex-end;gap:2px;height:34px;margin-top:6px}
.spark i{flex:1;background:var(--accent);border-radius:2px 2px 0 0;min-height:2px;opacity:.5}
.spark i.last{opacity:1;background:var(--accent2)}

/* Weekly High/Low strip */
.weekstrip{display:flex;gap:5px;margin:6px 0 2px}
.wcell{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px;border-radius:10px;
  border:1px solid var(--line);background:var(--card2)}
.wcell b{font-size:.72rem}
.wcell span{font-size:.54rem;letter-spacing:.03em;color:var(--muted2);font-weight:700}
.wcell.hi{border-color:rgba(255,77,94,.35)}.wcell.hi span{color:var(--red)}
.wcell.lo span{color:var(--blue)}
.wcell.rec span{color:var(--muted2)}
.wcell.now{background:var(--accent);border-color:var(--accent)}
.wcell.now b,.wcell.now span{color:#04110d}

/* Prescribed session blocks */
.rxblock{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;margin:10px 0}
.rxhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.rxtag{font-size:.6rem;font-weight:800;letter-spacing:.08em;background:var(--accent2);color:#0a0714;padding:2px 7px;border-radius:6px}
.rxhead b{font-size:.92rem}
.rxdesc{font-size:.78rem;color:var(--muted);line-height:1.45;margin:4px 0 8px}
.rxitem{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:.82rem}
.rxitem .ri-n{font-weight:600}
.rxitem .ri-s{color:var(--muted);text-align:right;flex-shrink:0;font-size:.78rem}
.rxtarget{font-size:.72rem;color:var(--accent);background:rgba(0,224,184,.06);border-radius:8px;padding:6px 9px;margin:6px 0}

.gatewarn{margin-top:12px;font-size:.78rem;color:var(--red);background:rgba(255,77,94,.08);border-radius:8px;padding:9px 11px;line-height:1.4}
.ckrow{font-size:.78rem;color:var(--muted);margin-top:8px}
.ckrow b{color:var(--txt)}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(var(--safe-bot) + 78px);
  background:var(--card2);border:1px solid var(--accent);color:var(--txt);padding:11px 16px;border-radius:12px;
  transform:translate(-50%,20px);font-size:.85rem;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:88%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{border-color:var(--red);color:var(--red)}

/* AI chat */
.chatlog{max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px 10px}
.chatempty{color:var(--muted2);font-size:.82rem;text-align:center;padding:18px 8px;line-height:1.5}
.bubble{max-width:88%;padding:10px 13px;border-radius:14px;font-size:.88rem;line-height:1.45;white-space:normal;word-wrap:break-word}
.bubble.user{align-self:flex-end;background:var(--accent);color:#04110d;border-bottom-right-radius:4px}
.bubble.assistant{align-self:flex-start;background:var(--card2);border:1px solid var(--line);border-bottom-left-radius:4px}
.dots{letter-spacing:2px;color:var(--muted2);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
.chatbar{display:flex;gap:8px;align-items:center;margin-top:4px}
.chatbar input{flex:1;padding:11px 13px}
.chatsend{background:var(--accent);color:#04110d;border:0;border-radius:12px;width:44px;height:44px;font-size:1.1rem;font-weight:800;cursor:pointer;flex-shrink:0}
.chatsend:disabled{opacity:.5}
.chatmeta{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.linkbtn{background:none;border:0;color:var(--muted);font-size:.75rem;cursor:pointer;text-decoration:underline}

/* Chat log-cards + example chips */
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip-row .chip{cursor:pointer;font-size:.8rem;padding:8px 13px}
.logcard{align-self:flex-start;max-width:100%;width:100%;background:var(--card2);border:1px solid var(--line);
  border-left:3px solid var(--green);border-radius:12px;padding:11px 13px;font-size:.85rem}
.logcard .lhead{font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lband{font-size:.68rem;font-weight:800;color:#04110d;padding:2px 8px;border-radius:99px;letter-spacing:.03em}
.lchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.lchip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 9px;font-size:.76rem;color:var(--muted)}
.lchip b{color:var(--txt);font-weight:800}
.ltable{width:100%;border-collapse:collapse;font-size:.78rem;margin-top:2px}
.ltable th{text-align:left;color:var(--muted2);font-weight:700;padding:3px 6px;border-bottom:1px solid var(--line);font-size:.72rem;text-transform:uppercase;letter-spacing:.03em}
.ltable td{padding:5px 6px;border-bottom:1px solid var(--line)}
.ltable td:first-child{font-weight:700;color:var(--txt)}
.ltable tr:last-child td{border-bottom:0}

/* Toggle */
.toggle{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.toggle span{flex:1;text-align:center;padding:11px 0;font-weight:700;font-size:.9rem;color:var(--muted)}
.toggle span:first-child{color:var(--txt);background:var(--card2)}
.toggle.on span:first-child{color:var(--muted);background:transparent}
.toggle.on span:last-child{color:#1a1200;background:var(--amber)}

</style>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand"><span class="logo">▲</span> APEX</div>
      <div id="phasePill" class="phase-pill" role="button" tabindex="0">Phase —</div>
    </header>

    <main id="view"><!-- rendered by ui.js --></main>

    <nav id="tabbar">
      <button class="tab" data-tab="today">   <span class="ic">◎</span><span>Today</span></button>
      <button class="tab" data-tab="log">      <span class="ic">✎</span><span>Log</span></button>
      <button class="tab" data-tab="progress"> <span class="ic">▲</span><span>Progress</span></button>
      <button class="tab" data-tab="coach">    <span class="ic">✦</span><span>Coach</span></button>
      <button class="tab" data-tab="settings"> <span class="ic">⚙</span><span>You</span></button>
    </nav>
  </div>

  <div id="modalRoot"></div>

  <script>
/* ============================================================================
   data.js — Knowledge base for the KNCT Hybrid Apex System (32-week program).
   Encodes: goals (current → 32-wk checkpoint → North Star), the 7 systems,
   exercise library, the 5-phase macrocycle, the High/Low weekly architecture,
   the readiness-gate thresholds, training zones, and nutrition anchors.
   Daily prescribed sessions live in program.js.
   ========================================================================== */

const DATA = (() => {

  /* --------------------------------------------------------------------------
     GOALS — current mark, 32-week checkpoint, and North Star.
     `lowerBetter` = time events. `proxies` = tech metrics that predict it.
     Times stored in seconds; vertical/broad in their native unit.
     ------------------------------------------------------------------------ */
  const GOALS = [
    { id: '100m',  name: '100 m',   unit: 's',  lowerBetter: true,  current: 11.9,  checkpoint: [11.3, 11.4],  northStar: 10.9,  limiters: ['Max velocity', 'RFD', 'Tendon stiffness'], proxies: ['fly30', 'sprint10', 'cmj', 'keiserWatts'] },
    { id: '200m',  name: '200 m',   unit: 's',  lowerBetter: true,  current: 23.9,  checkpoint: [22.8, 23.0],  northStar: null,  limiters: ['Speed', 'Speed endurance'],                proxies: ['fly30', 'sprint30'] },
    { id: '400m',  name: '400 m',   unit: 's',  lowerBetter: true,  current: 56.0,  checkpoint: [52.5, 53.5],  northStar: 49.0,  limiters: ['Glycolytic capacity', 'Speed reserve'],     proxies: ['fly30', 'sprint30'] },
    { id: 'mile',  name: 'Mile',    unit: 's',  lowerBetter: true,  current: 305,   checkpoint: [292, 296],    northStar: 285,   limiters: ['Threshold', 'VO₂', 'Economy'],             proxies: ['criticalPower', 'runEconomy'] },
    { id: '5k',    name: '5K',      unit: 's',  lowerBetter: true,  current: 1230,  checkpoint: [1095, 1125],  northStar: 900,   limiters: ['Aerobic floor (your #1 gap)', 'Threshold'], proxies: ['criticalPower', 'runEconomy'] },
    { id: 'vertical', name: 'Vertical (CMJ)', unit: 'in', lowerBetter: false, current: 31, checkpoint: [35, 37], northStar: 40, limiters: ['Relative force', 'RFD'],           proxies: ['cmj', 'rsi', 'relForce'] },
    { id: 'broad', name: 'Broad Jump', unit: 'm', lowerBetter: false, current: 2.95, checkpoint: [3.15, 3.25], northStar: null, limiters: ['Horizontal power'],                proxies: ['cmj'] },
    { id: 'clean', name: 'Power Clean', unit: 'lb', lowerBetter: false, current: null, checkpoint: [285, 300], northStar: null, limiters: ['Force expression'],                 proxies: ['isoPull', 'peakForce'] },
    { id: 'hyrox', name: 'HYROX Pro',  unit: 'min', lowerBetter: true,  current: 67,  checkpoint: [58, 61],     northStar: 57,   limiters: ['Compromised running', 'Station economy'], proxies: ['criticalPower'] },
    { id: 'bw',    name: 'Bodyweight', unit: 'kg', lowerBetter: true,  current: 77,  checkpoint: [74, 76],     northStar: null,  limiters: ['Power-to-weight'],                        proxies: [] },
  ];

  /* --------------------------------------------------------------------------
     TEST METRICS — objective device numbers, grouped by assessment tool.
     ------------------------------------------------------------------------ */

/* ============================================================================
   store.js — Local persistence. Everything lives in the browser (localStorage),
   private to the device. Export/import lets the athlete back up or move data.
   ========================================================================== */

const Store = (() => {
  const KEY = 'apex_journal_v1';

  const DEFAULT = {
    profile: {
      name: '',
      bodyweightKg: 77,
      startDateISO: '2026-06-15', // Week 1 anchor (Mon) — race 2027-01-24 lands end of wk 32
      phaseId: 1,          // fallback phase if no start date set
      phaseWeek: 1,        // fallback week
      variant: 'C',        // Phase-5 sport variant: A=Football, B=HYROX, C=Track
      hrMax: 190,          // for zone calibration
      criticalPower: 308,  // Stryd CP (W) — re-anchor zones after testing
      goalDateISO: '2027-01-24', // A-race date
    },
    // Personal bests / current standing per goal id -> value
    bests: {},
    // Daily logs keyed by ISO date "YYYY-MM-DD"
    days: {},
    // Test results: array of { date, metric, value }
    tests: [],
    // AI coach chat history: array of { role, content }
    chat: [],
    settings: { hrvEnabled: true, useMetric: true, aiKey: '', aiModel: 'claude-opus-4-8', notionUrl: '', notionKey: '' },
  };

  let state = load();

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return structuredClone(DEFAULT);
      const parsed = JSON.parse(raw);
      return { ...structuredClone(DEFAULT), ...parsed,
        profile: { ...DEFAULT.profile, ...(parsed.profile || {}) },
        settings: { ...DEFAULT.settings, ...(parsed.settings || {}) } };
    } catch (e) {
      console.warn('Store load failed, resetting', e);
      return structuredClone(DEFAULT);
    }
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { console.error('Save failed', e); }
  }

  /* ---- Day accessors --------------------------------------------------- */
  function blankDay(date) {
    return {
      date,
      wellness: null,          // { sleepH, sleepQ, hrv, rhr, soreness, energy, mood, stress, motivation }
      readiness: null,         // computed { score, band, components }
      session: null,           // { type, exercises:[{name,cat,sets:[{...}]}], sRPE, durationMin, load }
      recoveryDone: [],        // recovery actions checked off
      notes: '',
    };
  }

  function getDay(date) {
    if (!state.days[date]) state.days[date] = blankDay(date);
    return state.days[date];
  }

  function setDay(date, patch) {
    state.days[date] = { ...getDay(date), ...patch };
    save();
    return state.days[date];
  }

  function lastNDays(n, uptoDate) {
    const dates = Object.keys(state.days).sort();
    const upto = uptoDate || dates[dates.length - 1];
    return dates.filter(d => d <= upto).slice(-n).map(d => state.days[d]);
  }

  function allDaysSorted() {
    return Object.keys(state.days).sort().map(d => state.days[d]);
  }

  /* ---- Tests ----------------------------------------------------------- */
  function addTest(metric, value, date) {
    state.tests.push({ metric, value: Number(value), date });
    state.tests.sort((a, b) => a.date.localeCompare(b.date));
    save();
  }
  function testsFor(metric) {
    return state.tests.filter(t => t.metric === metric).sort((a, b) => a.date.localeCompare(b.date));
  }
  function latestTest(metric) {
    const t = testsFor(metric);
    return t.length ? t[t.length - 1] : null;
  }

  /* ---- Profile / bests ------------------------------------------------- */
  function setProfile(patch) { state.profile = { ...state.profile, ...patch }; save(); }
  function setBest(goalId, value) { state.bests[goalId] = Number(value); save(); }

  /* ---- Backup ---------------------------------------------------------- */
  function exportJSON() { return JSON.stringify(state, null, 2); }
  function importJSON(str) {
    const parsed = JSON.parse(str);
    state = { ...structuredClone(DEFAULT), ...parsed };
    save();
  }
  function reset() { state = structuredClone(DEFAULT); save(); }

  return {
    get state() { return state; },
    save, getDay, setDay, blankDay, lastNDays, allDaysSorted,
    addTest, testsFor, latestTest, setProfile, setBest,
    exportJSON, importJSON, reset,
  };
})();

  <script>
/* ============================================================================
   engine.js — The coach's brain (KNCT Hybrid Apex System).
   Readiness = CMJ-vs-baseline gate + hard-gate overrides (per the doc).
   Plus training load/ACWR, program-week + phase awareness, the High/Low weekly
   architecture, goal projections (checkpoint + North Star), per-set auto-reg,
   weekly diagnostic drift, and daily emphasis. Deterministic, offline, private.
   ========================================================================== */

const Engine = (() => {

  const clamp = (x, lo = 0, hi = 100) => Math.max(lo, Math.min(hi, x));
  const mean  = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0;
  const std   = a => { if (a.length < 2) return 0; const m = mean(a); return Math.sqrt(mean(a.map(x => (x - m) ** 2))); };
  const BANDS = { green: 0, amber: 1, red: 2 };
  const worst = (...bs) => Object.keys(BANDS)[Math.max(...bs.filter(Boolean).map(b => BANDS[b]))] || 'green';

  const DAY_ABBR = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  function todayISO(d = new Date()) { const tz = d.getTimezoneOffset() * 60000; return new Date(d - tz).toISOString().slice(0, 10); }
  function weekdayOf(dateISO) { return DAY_ABBR[new Date(dateISO + 'T12:00:00').getDay()]; }
  function daysBetween(a, b) { return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000); }

  /* ---- Program week (1..32) from the anchored start date ---------------- */
  function programWeek(dateISO) {
    const start = Store.state.profile.startDateISO;
    if (!start) return null;
    const d = daysBetween(start, dateISO);
    if (d < 0) return null;
    return Math.floor(d / 7) + 1;
  }
  function phaseForWeek(wk) {
    if (wk == null) return null;
    return DATA.PHASES.find(p => wk >= p.weeks[0] && wk <= p.weeks[1]) || null;
  }
  function currentPhase(dateISO) {
    return phaseForWeek(programWeek(dateISO)) || DATA.PHASES.find(p => p.id === Store.state.profile.phaseId) || DATA.PHASES[0];
  }
  function isDeloadWeek(dateISO) {
    const wk = programWeek(dateISO), ph = phaseForWeek(wk);
    return !!(ph && wk != null && ph.deloads.includes(wk));
  }

  /* ==========================================================================
     TRAINING LOAD — session RPE (RPE × min) + ACWR (7d avg / 28d avg).
     ======================================================================== */
  function sessionLoad(session) {
    if (!session) return 0;
    if (session.load) return session.load;
    return Math.round((session.sRPE || 5) * (session.durationMin || 45));
  }
  function acwr(date) {
    const load = d => sessionLoad(d.session);
    const acute = mean(Store.lastNDays(7, date).map(load));
    const chronic = mean(Store.lastNDays(28, date).map(load));
    if (chronic === 0) return { ratio: null, acute: Math.round(acute), chronic: 0 };
    return { ratio: +(acute / chronic).toFixed(2), acute: Math.round(acute), chronic: Math.round(chronic) };
  }

  /* ==========================================================================
     READINESS GATE — CMJ vs rolling baseline is the primary readout; hard
     gates (RHR / sleep / subjective / bodyweight / pain) can force downgrade.
     ======================================================================== */
  function priorWellness(field, date, n = 7) {
    return Store.lastNDays(n + 1, date)
      .filter(d => d.date < date && d.wellness && typeof d.wellness[field] === 'number')
      .map(d => d.wellness[field]);
  }
  function subjective10(w) {
    // derive a 1–10 subjective readiness from the 1–5 scales
    const up = [w.energy, w.mood, w.motivation].filter(v => v);
    const down = [w.soreness, w.stress].filter(v => v);
    if (!up.length && !down.length) return null;
    const pos = up.length ? mean(up) : 3;                 // 1–5
    const neg = down.length ? mean(down.map(v => 6 - v)) : 3; // invert, 1–5
    return +(((pos + neg) / 2) * 2).toFixed(1);           // → 1–10
  }

  function readiness(date) {
    const w = Store.getDay(date).wellness;
    if (!w) return null;
    const G = DATA.GATE;
    const parts = [];
    let cmjBand = null, score = null, cmjNote = '';

    // --- CMJ gate (primary) ---
    const cmjHist = priorWellness('cmj', date, 7);
    if (typeof w.cmj === 'number' && cmjHist.length >= 3) {
      const base = mean(cmjHist);
      const dPct = ((w.cmj - base) / base) * 100;
      cmjBand = dPct >= -G.cmj.greenWithinPct ? 'green' : dPct >= -G.cmj.amberDownPct ? 'amber' : 'red';
      // numeric score
      score = dPct >= 0 ? clamp(85 + dPct * 2, 85, 100)
            : dPct >= -5 ? clamp(70 + (dPct + 5) * 3, 70, 85)
            : dPct >= -10 ? clamp(45 + (dPct + 10) * 5, 45, 70)
            : clamp(45 + (dPct + 10) * 3, 12, 45);
      cmjNote = `CMJ ${w.cmj}cm vs ${base.toFixed(1)}cm base (${dPct >= 0 ? '+' : ''}${dPct.toFixed(1)}%)`;
      parts.push({ key: 'CMJ (neuromuscular)', score: Math.round(score), note: cmjNote });
    }

    // --- HRV (modifier / signal) ---
    if (typeof w.hrv === 'number') {
      const h = priorWellness('hrv', date, 14);
      if (h.length >= 5) {
        const z = std(h) ? (w.hrv - mean(h)) / std(h) : 0;
        const s = clamp(72 + z * 20);
        parts.push({ key: 'HRV', score: Math.round(s), note: `${w.hrv}ms vs ${Math.round(mean(h))}ms base (${z >= 0 ? '+' : ''}${z.toFixed(1)}σ)` });
        if (score == null) score = s;                          // fallback base if no CMJ
        else score = clamp(score * 0.85 + s * 0.15);           // small HRV nudge
      }
    }

    // --- Sleep (context) ---
    if (typeof w.sleepH === 'number') {
      const s = clamp((w.sleepH / 8) * 100);
      parts.push({ key: 'Sleep', score: Math.round(s), note: `${w.sleepH}h${w.sleepQ ? ', q' + w.sleepQ + '/5' : ''}` });
      if (score == null) score = s;
    }

    // --- Subjective (context) ---
    const subj = subjective10(w);
    if (subj != null) {
      parts.push({ key: 'Subjective', score: Math.round(subj * 10), note: `${subj}/10 (energy ${w.energy || '–'}, sore ${w.soreness || '–'}, stress ${w.stress || '–'})` });
      if (score == null) score = subj * 10;
    }

    if (score == null) score = 60;

    // --- Hard gates (any one → ≥amber, two → red) ---
    const gates = [];
    const rhrHist = priorWellness('rhr', date, 14);
    if (typeof w.rhr === 'number' && rhrHist.length >= 3 && (w.rhr - mean(rhrHist)) >= G.hard.rhrOverBaseline)
      gates.push(`Resting HR +${Math.round(w.rhr - mean(rhrHist))} over baseline`);
    if (typeof w.sleepH === 'number' && w.sleepH < G.hard.sleepMinH) gates.push(`Sleep ${w.sleepH}h (<6h)`);
    if (subj != null && subj < G.hard.subjMin) gates.push(`Subjective ${subj}/10 (<5)`);
    const bwHist = priorWellness('bodyweightKg', date, 4);
    if (typeof w.bodyweightKg === 'number' && bwHist.length) {
      const dropPct = ((bwHist[bwHist.length - 1] - w.bodyweightKg) / bwHist[bwHist.length - 1]) * 100;
      if (dropPct >= G.hard.bwOvernightDropPct) gates.push(`Bodyweight ${dropPct.toFixed(1)}% down overnight (hydration/glycogen)`);
    }
    if (w.pain) gates.push('Sharp/localized pain flagged — assess before loading');

    let gateBand = gates.length >= 2 ? 'red' : gates.length === 1 ? 'amber' : null;

    // --- Final band = worst of CMJ gate, HRV/subjective fallback, hard gates ---
    let scoreBand = score >= 67 ? 'green' : score >= 40 ? 'amber' : 'red';
    let band = worst(cmjBand || scoreBand, gateBand);

    // clamp numeric score to the band so the ring and the call agree
    if (band === 'red') score = Math.min(score, 39);
    else if (band === 'amber') score = Math.min(Math.max(score, 40), 66);
    else score = Math.max(score, 67);
    score = Math.round(score);

    return {
      score, band, components: parts, gates,
      action: DATA.GATE.action[band],
      cmjBand, load: acwr(date),
      hasCMJ: cmjBand != null,
    };
  }

  /* ==========================================================================
     DAILY DECISION — weekday architecture + prescribed session + readiness.
     ======================================================================== */
  function decideDay(date) {
    const phase = currentPhase(date);
    const wk = programWeek(date);
    const day = weekdayOf(date);
    const arch = DATA.WEEK_ARCH.find(a => a.day === day);
    const prescribed = PROGRAM.forDay(phase.id, day);
    const deload = isDeloadWeek(date);
    const r = readiness(date);
    const highDay = DATA.HIGH_DAYS.includes(day);

    let headline, advice = [];
    if (!r) {
      headline = 'Run the morning readiness gate to get today\'s call.';
      advice.push('HRV + 3× CMJ on the force plate → log it and I\'ll set green/amber/red.');
    } else if (r.band === 'green') {
      headline = `GREEN — ${arch ? arch.load : ''} day, full session as written.`;
      advice.push(`Readiness ${r.score}. ${DATA.GATE.action.green}`);
      if (highDay) advice.push('CNS is fresh — full-intent reps, full recoveries. This is a day to spend quality.');
    } else if (r.band === 'amber') {
      headline = `AMBER — auto-regulate today.`;
      advice.push(`Readiness ${r.score}. ${DATA.GATE.action.amber}`);
      if (r.gates.length) advice.push(`Flag: ${r.gates.join('; ')}.`);
    } else {
      headline = highDay ? `RED — pull the plug on CNS work.` : `RED — keep it genuinely easy.`;
      advice.push(`Readiness ${r.score}. ${DATA.GATE.action.red}`);
      if (r.gates.length) advice.push(`Flag: ${r.gates.join('; ')}.`);
      advice.push('A red day taken is cheaper than a torn hamstring taken. The force plate exists so you stop guessing on this.');
    }

    if (deload) advice.push(`Deload week (wk ${wk}) — ~40% volume, intensity held. Bank the adaptation.`);

    if (r && r.load && r.load.ratio != null) {
      if (r.load.ratio > 1.5) advice.push(`Workload spike (ACWR ${r.load.ratio}) — high injury-risk zone; trim volume this week.`);
      else if (r.load.ratio < 0.8 && !deload) advice.push(`Workload low (ACWR ${r.load.ratio}) — fine for a taper, don't detrain mid-block.`);
    }

    return { phase, wk, day, arch, prescribed, deload, readiness: r, headline, advice };
  }

  /* ==========================================================================
     GOAL PROJECTIONS — trend → ETA to 32-week checkpoint & North Star.
     ======================================================================== */
  function projectGoal(goal) {
    const tests = Store.testsFor(goal.id);
    const bestOverride = Store.state.bests[goal.id];
    let hist = tests.length ? tests.map(t => ({ date: t.date, value: t.value })) : [];
    let current = tests.length ? tests[tests.length - 1].value
                : bestOverride != null ? bestOverride
                : goal.current;
    if (current == null) return { status: 'no-data', goal };

    const ckMid = goal.checkpoint ? (goal.checkpoint[0] + goal.checkpoint[1]) / 2 : null;
    const nsTarget = goal.northStar;
    const gapTo = t => t == null ? null : (goal.lowerBetter ? current - t : t - current);

    let perWeek = null, improving = null, etaCkWeeks = null;
    if (hist.length >= 2) {
      const x0 = hist[0].date;
      const xs = hist.map(h => daysBetween(x0, h.date));
      const ys = hist.map(h => h.value);
      const mx = mean(xs), my = mean(ys);
      const denom = xs.reduce((s, x) => s + (x - mx) ** 2, 0) || 1;
      const slope = xs.reduce((s, x, i) => s + (x - mx) * (ys[i] - my), 0) / denom;
      perWeek = +(slope * 7).toFixed(3);
      improving = goal.lowerBetter ? slope < 0 : slope > 0;
      const rem = gapTo(ckMid);
      if (rem != null && rem > 0 && improving && Math.abs(perWeek) > 0)
        etaCkWeeks = Math.ceil(rem / Math.abs(perWeek));
    }

    // progress bar: current position from goal.current → North Star (or checkpoint hi)
    const anchorStart = goal.current;
    const anchorEnd = nsTarget != null ? nsTarget : (goal.checkpoint ? goal.checkpoint[goal.lowerBetter ? 0 : 1] : current);
    let pct = 50;
    if (anchorStart != null && anchorEnd != null && anchorStart !== anchorEnd) {
      pct = clamp(((anchorStart - current) / (anchorStart - anchorEnd)) * 100);
    }

    return {
      status: 'ok', goal, current, ckMid, nsTarget,
      gapToCk: gapTo(ckMid), gapToNs: gapTo(nsTarget),
      perWeek, improving, etaCkWeeks, trendPoints: hist.length, pct: Math.round(pct),
    };
  }

  /* ==========================================================================
     WEEKLY DIAGNOSTIC DRIFT — flag a maintained quality declining 2 weeks.
     ======================================================================== */
  function diagnosticDrift(metricId) {
    const t = Store.testsFor(metricId);
    if (t.length < 3) return null;
    const meta = DATA.METRICS.find(m => m.id === metricId) || { lowerBetter: false };
    const [a, b, c] = t.slice(-3);
    const worse = (x, y) => meta.lowerBetter ? x.value > y.value : x.value < y.value;
    const declining = worse(c, b) && worse(b, a);   // two consecutive down
    return { metricId, declining, latest: c.value, prev: b.value };
  }

  /* ==========================================================================
     PER-SET AUTO-REGULATION — feedback after each logged set.
     ======================================================================== */
  function nextSetAdvice(exercise, setIndex, sets) {
    const cat = DATA.CATEGORIES[exercise.cat];
    if (!cat) return { rest: '', cue: '' };
    const set = sets[setIndex];
    const advice = [];
    const restLabel = cat.restSec >= 60 ? `${Math.round(cat.restSec / 60 * 10) / 10} min` : `${cat.restSec}s`;

    if (cat.velDropStop && set.velocity != null) {
      const best = Math.max(...sets.slice(0, setIndex + 1).map(s => s.velocity || 0));
      if (best > 0) {
        const drop = ((best - set.velocity) / best) * 100;
        advice.push(drop >= cat.velDropStop
          ? `⛔ Velocity down ${drop.toFixed(0)}% from best — power quality is gone. End this exercise.`
          : `✅ Speed holding (${drop.toFixed(0)}% off best). Keep full intent.`);
      }
    }
    if (exercise.cat === 'speed' && set.time != null && set.best != null) { /* reserved */ }

    if (set.rpe != null && cat.targetRPE) {
      const [lo, hi] = cat.targetRPE;
      if (set.rpe > hi) advice.push(exercise.cat === 'speed'
        ? `Effort ${set.rpe}/10 above target — fatiguing. Extend rest or cut reps.`
        : `RPE ${set.rpe} above target ${hi} — drop load ~5–10% next set to keep bar speed.`);
      else if (set.rpe < lo && ['strength', 'power', 'iso'].includes(exercise.cat))
        advice.push(`RPE ${set.rpe} below target ${lo} — add load next set.`);
      else advice.push(`RPE ${set.rpe} on target — hold this load.`);
    }
    if (exercise.cat === 'plyo' && set.rsi != null) advice.push(set.rsi >= 2.0 ? `RSI ${set.rsi} — stiff and reactive.` : `RSI ${set.rsi} below 2.0 — contacts are damping; reduce volume.`);

    advice.push(cat.restSec > 0 ? `Rest ~${restLabel} before the next set.` : 'Continuous — no rest prescribed.');
    return { rest: restLabel, cue: advice.join(' ') };
  }

  /* ==========================================================================
     WEEKLY COMPLIANCE — logged volume vs phase prescription.
     ======================================================================== */
  function weeklyReport(date) {
    const phase = currentPhase(date);
    const days = Store.lastNDays(7, date);
    const t = { sprintM: 0, thresholdMin: 0, zone2Min: 0, plyoContacts: 0 };
    days.forEach(d => (d.session && d.session.exercises || []).forEach(ex => (ex.sets || []).forEach(s => {
      const n = parseFloat(s.distance) || 0, reps = parseFloat(s.reps) || 1;
      if (ex.cat === 'speed') t.sprintM += n * reps;
      if (ex.cat === 'threshold') t.thresholdMin += parseFloat(s.minutes) || 0;
      if (ex.cat === 'zone2') t.zone2Min += parseFloat(s.minutes) || 0;
      if (ex.cat === 'plyo') t.plyoContacts += parseFloat(s.contacts) || 0;
    })));
    const band = (v, [lo, hi]) => v < lo * 0.85 ? 'under' : v > hi * 1.15 ? 'over' : 'on';
    return { phase, items: [
      { label: 'Sprint volume', unit: 'm',   val: Math.round(t.sprintM),      target: phase.dose.sprintM,      band: band(t.sprintM, phase.dose.sprintM) },
      { label: 'Threshold',     unit: 'min', val: Math.round(t.thresholdMin), target: phase.dose.thresholdMin, band: band(t.thresholdMin, phase.dose.thresholdMin) },
      { label: 'Zone 2',        unit: 'min', val: Math.round(t.zone2Min),     target: phase.dose.zone2Min,     band: band(t.zone2Min, phase.dose.zone2Min) },
      { label: 'Plyo contacts', unit: '',    val: Math.round(t.plyoContacts), target: phase.dose.plyoContacts, band: band(t.plyoContacts, phase.dose.plyoContacts) },
    ] };
  }

  return {
    readiness, acwr, sessionLoad, projectGoal, decideDay, nextSetAdvice, weeklyReport,
    todayISO, weekdayOf, programWeek, currentPhase, isDeloadWeek, diagnosticDrift, phaseForWeek,
  };
})();

  <script>
/* ============================================================================
   logger.js — Natural-language logging. Turns a plain sentence like
   "slept 7h, HRV 58, CMJ 33, front squat 4x4 @100kg RPE8, 1000m tempo RPE7,
   12 depth jumps RSI 2.3, felt good, session 7" into structured wellness +
   session data written straight into the journal. Runs 100% on-device — no
   API key needed. The live AI coach (if enabled) layers on top.
   ========================================================================== */

const NaturalLog = (() => {

  /* ---- movement lexicon: keyword -> category -------------------------- */
  const LEX = [
    // strength
    ['front squat','strength'],['back squat','strength'],['box squat','strength'],
    ['split squat','strength'],['squat','strength'],['deadlift','strength'],
    ['romanian','strength'],['rdl','strength'],['hip thrust','strength'],
    ['bench','strength'],['overhead press','strength'],['ohp','strength'],
    ['push press','strength'],['press','strength'],['pull-up','strength'],
    ['pullup','strength'],['chin','strength'],['row','strength'],['lunge','strength'],
    ['power clean','strength'],['hang clean','strength'],['clean','strength'],
    ['snatch','strength'],['jerk','strength'],['curl','strength'],['calf','strength'],
    ['nordic','strength'],['glute','strength'],['core','accessory'],['plank','accessory'],
    // plyometric
    ['depth jump','plyo'],['drop jump','plyo'],['box jump','plyo'],['broad jump','plyo'],
    ['pogo','plyo'],['hurdle hop','plyo'],['bound','plyo'],['hop','plyo'],
    ['plyo','plyo'],['cmj','plyo'],['jump','plyo'],
    // speed
    ['flying sprint','speed'],['fly','speed'],['sprint','speed'],['accel','speed'],
    ['acceleration','speed'],['wicket','speed'],['stride','speed'],['block start','speed'],
    // conditioning / endurance
    ['tempo run','conditioning'],['tempo','conditioning'],['easy run','conditioning'],
    ['long run','conditioning'],['interval','conditioning'],['run','conditioning'],
    ['jog','conditioning'],['bike','conditioning'],['erg','conditioning'],
    ['ski','conditioning'],['ruck','conditioning'],['swim','conditioning'],
    ['zone 2','conditioning'],['z2','conditioning'],['row erg','conditioning'],
  ];

  const FEEL = {
    great:5, amazing:5, excellent:5, strong:5, fresh:5, awesome:5, incredible:5, primed:5,
    good:4, solid:4, nice:4, decent:4, sharp:4,
    ok:3, okay:3, fine:3, alright:3, average:3, 'so-so':3, meh:3, normal:3,
    tired:2, flat:2, rough:2, sluggish:2, off:2, low:2, sore:2, heavy:2,
    exhausted:1, terrible:1, awful:1, dead:1, wrecked:1, shattered:1, drained:1,
  };

  const first = (re, s, i = 1) => { const m = s.match(re); return m ? parseFloat(m[i]) : null; };
  const titleCase = s => s.replace(/\b\w/g, c => c.toUpperCase());

  /* ---- wellness ------------------------------------------------------- */
  function parseWellness(t) {
    const w = {}, cap = [];
    const put = (k, v, label) => { if (v != null && !Number.isNaN(v)) { w[k] = v; cap.push(label); } };

    put('sleepH',
      first(/\bslept?\s*(?:for\s*)?(\d+(?:\.\d+)?)\s*(?:h|hr|hrs|hours)?\b/, t) ??
      first(/(\d+(?:\.\d+)?)\s*(?:h|hrs|hours)\s*(?:of\s*)?sleep/, t), 'sleep');
    put('sleepQ', first(/sleep\s*(?:quality|q)\s*(\d)(?:\s*\/\s*5)?/, t) ??
      first(/quality\s*(\d)\s*\/\s*5/, t), 'sleep quality');
    put('hrv', first(/\bhrv\s*(?:of|was|is|=|:|at)?\s*(\d+(?:\.\d+)?)/, t), 'HRV');
    put('rhr', first(/(?:resting\s*(?:hr|heart\s*rate)|\brhr\b)\s*(?:of|was|is|=|:|at)?\s*(\d+(?:\.\d+)?)/, t), 'resting HR');
    put('cmj', first(/\bcmj\b\D{0,15}(\d+(?:\.\d+)?)/, t) ??
      first(/(?:vertical|jump(?:ed)?)\D{0,8}(\d+(?:\.\d+)?)\s*cm/, t), 'CMJ');
    put('bodyweightKg', first(/(?:bodyweight|body\s*weight|\bbw\b)\s*(?:of|was|is|=|:|at)?\s*(\d+(?:\.\d+)?)/, t), 'bodyweight');

    ['energy','mood','stress','motivation'].forEach(k => {
      const v = first(new RegExp(k + '\\w*\\s*(?:of|was|is|=|:|at)?\\s*(\\d)(?:\\s*\\/\\s*5)?'), t);
      put(k, v, k);
    });
    const soreN = first(/sore(?:ness)?\s*(?:of|was|is|=|:|at)?\s*(\d)(?:\s*\/\s*5)?/, t);
    put('soreness', soreN, 'soreness');

    // subjective feel words -> energy + mood if not explicitly given
    const fm = t.match(/(?:felt|feeling|feel)\s+(?:like\s+|a\s+|really\s+|pretty\s+|very\s+)?([a-z-]+)/);
    if (fm && FEEL[fm[1]] != null) {
      if (w.energy == null) { w.energy = FEEL[fm[1]]; cap.push('energy'); }
      if (w.mood == null) w.mood = FEEL[fm[1]];
      if (fm[1] === 'sore' && w.soreness == null) w.soreness = 4;
    }
    return { w, cap };
  }

  /* ---- session RPE ---------------------------------------------------- */
  function parseSessionRPE(t) {
    return first(/(?:session|whole session|overall)\s*(?:felt like|was|rpe)?\s*(?:a\s*)?(\d+(?:\.\d+)?)/, t) ??
           first(/\bs\s*rpe\s*(\d+(?:\.\d+)?)/, t) ??
           first(/felt like\s*(?:a\s*)?(\d+(?:\.\d+)?)\s*(?:\/\s*10)?\s*$/, t);
  }

  /* ---- exercises ------------------------------------------------------ */
  function parseExercises(t) {
    const clauses = t.split(/[,;\n]|\band\b|\bthen\b|\bplus\b/g).map(s => s.trim()).filter(Boolean);
    const out = [];
    for (const c of clauses) {
      // skip pure-wellness clauses
      if (/\b(slept|sleep|hrv|resting|rhr|bodyweight|body weight)\b/.test(c)) continue;
      if (/\bcmj\b/.test(c) && !/[x×]/.test(c)) continue;

      const sr = c.match(/(\d+)\s*[x×]\s*(\d+)/) || c.match(/(\d+)\s*by\s*(\d+)/);
      // load: "@100", "@ 100kg", or whole-word "at 100" (NOT the "at" inside "squat")
      const load = first(/(?:@\s*|\bat\s+)(\d+(?:\.\d+)?)\s*(?:kg|kgs|lb|lbs|pounds)?/, c) ??
                   first(/(\d+(?:\.\d+)?)\s*(?:kg|kgs)\b/, c);
      const isLb = /(?:@\s*|\bat\s+)?\d+(?:\.\d+)?\s*(?:lb|lbs|pounds)\b/.test(c);
      const rpe = first(/rpe\s*(\d+(?:\.\d+)?)/, c);
      const vel = first(/(\d+(?:\.\d+)?)\s*m\/s/, c);
      let dist = first(/(\d+(?:\.\d+)?)\s*(?:km)\b/, c);
      if (dist != null) dist *= 1000; else dist = first(/(\d+(?:\.\d+)?)\s*(?:m|meters?|metres?)\b(?!\/)/, c);
      const mins = first(/(\d+(?:\.\d+)?)\s*(?:min|mins|minutes)\b/, c);
      // contacts: "12 contacts", "12 jumps", or "12 depth jumps" (words between number and noun)
      const contacts = first(/(\d+)\s*(?:contacts|jumps|bounds|hops|throws|reps)\b/, c) ??
                       first(/(\d+)\s+(?:[a-z]+\s+){1,2}(?:contacts|jumps|bounds|hops|throws)\b/, c);
      const rsi = first(/rsi\s*(?:of|~|around|=|:)?\s*(\d+(?:\.\d+)?)/, c);

      // category / name from lexicon
      let cat = null, hit = null;
      for (const [kw, k] of LEX) { if (c.includes(kw)) { cat = k; hit = kw; break; } }

      const accept = sr || load != null || dist != null || contacts != null || rsi != null ||
                     (mins != null && cat) || (cat && cat !== 'plyo');
      if (!accept) continue;
      if (!cat) cat = load != null || sr ? 'strength' : 'accessory';

      // build a display name: clause minus the numeric tokens
      let name = c
        .replace(/(\d+)\s*[x×]\s*(\d+)/g, ' ').replace(/(\d+)\s*by\s*(\d+)/g, ' ')
        .replace(/(?:@|at)\s*\d+(?:\.\d+)?\s*(?:kg|kgs|lb|lbs|pounds)?/g, ' ')
        .replace(/\d+(?:\.\d+)?\s*(?:kg|kgs|lb|lbs|pounds|m\/s|km|m|meters?|metres?|min|mins|minutes|contacts|jumps|bounds|hops|throws|reps|cm)\b/g, ' ')
        .replace(/rpe\s*\d+(?:\.\d+)?/g, ' ').replace(/rsi\s*(?:of|~|around|=|:)?\s*\d+(?:\.\d+)?/g, ' ')
        .replace(/\b(did|a|of|for|the|some|my|felt|like|run)\b/g, ' ')
        .replace(/\b\d+(?:\.\d+)?\b/g, ' ')
        .replace(/[^a-z0-9\s-]/g, ' ').replace(/\s+/g, ' ').trim();
      if (!name || name.length < 2) name = hit || 'Exercise';
      name = titleCase(name);

      const ld = isLb && load != null ? Math.round(load * 0.4536 * 2) / 2 : load;
      const base = {};
      if (ld != null) base.load = ld;
      if (rpe != null) base.rpe = rpe;
      if (vel != null) base.velocity = vel;

      let sets;
      if (sr) {
        const n = Math.min(20, Math.max(1, parseInt(sr[1], 10)));
        const reps = parseInt(sr[2], 10);
        sets = Array.from({ length: n }, () => ({ ...base, reps }));
      } else {
        const one = { ...base };
        if (dist != null) one.distance = dist;
        if (mins != null) one.minutes = mins;
        if (contacts != null) one.reps = contacts;
        if (rsi != null) one.rsi = rsi;
        sets = [one];
      }
      out.push({ name, cat, sets });
    }
    return out;
  }

  function parse(text) {
    const t = ' ' + String(text).toLowerCase().replace(/[，]/g, ',') + ' ';
    const { w, cap } = parseWellness(t);
    const exercises = parseExercises(t);
    const sRPE = parseSessionRPE(t);
    return { wellness: w, wellnessCap: cap, exercises, sRPE,
      captured: cap.length > 0 || exercises.length > 0 || sRPE != null };
  }

  /* ---- write it into the journal -------------------------------------- */
  function apply(date, text) {
    const p = parse(text);
    if (!p.captured) return { ...p, readiness: null };

    const day = Store.getDay(date);

    // wellness (merge, don't wipe existing fields)
    if (p.wellnessCap.length) {
      const wellness = { ...(day.wellness || {}), ...p.wellness };
      Store.setDay(date, { wellness });
      if (p.wellness.cmj != null && !Store.testsFor('cmj').some(tt => tt.date === date))
        Store.addTest('cmj', p.wellness.cmj, date);
    }

    // session (append to any existing)
    if (p.exercises.length || p.sRPE != null) {
      const s = day.session && day.session.exercises
        ? day.session
        : { type: 'Logged', durationMin: 0, sRPE: 0, exercises: [] };
      s.exercises = s.exercises.concat(p.exercises);
      const totalMins = s.exercises.reduce((a, ex) =>
        a + (ex.sets || []).reduce((b, st) => b + (st.minutes || 0), 0), 0);
      if (totalMins) s.durationMin = Math.max(s.durationMin || 0, totalMins);
      if (!s.durationMin) s.durationMin = 60;
      if (p.sRPE != null) s.sRPE = p.sRPE;
      if (!s.sRPE) s.sRPE = 6;
      s.load = (typeof Engine !== 'undefined' && Engine.sessionLoad) ? Engine.sessionLoad(s) : 0;
      Store.setDay(date, { session: s });
    }

    // recompute readiness
    let readiness = null;
    if (typeof Engine !== 'undefined' && Engine.readiness) {
      readiness = Engine.readiness(date);
      if (readiness) Store.setDay(date, { readiness });
    }
    return { ...p, readiness };
  }

  return { parse, apply };
})();

  <script>
/* ============================================================================
   coach.js — Live Claude AI chat coach (optional layer over the built-in engine).
   Calls the Anthropic Messages API directly from the browser. The API key is
   stored only in this device's localStorage and sent only to api.anthropic.com.
   Streams responses via SSE. The system prompt is prompt-cached to cut cost.
   ========================================================================== */

const AICoach = (() => {
  const API = 'https://api.anthropic.com/v1/messages';
  const VERSION = '2023-06-01';

  function enabled() { return !!(Store.state.settings.aiKey); }
  function model() { return Store.state.settings.aiModel || 'claude-opus-4-8'; }

  /* ---- Build the coaching system prompt from the athlete's live data ----- */
  function buildSystem(date) {
    const p = Store.state.profile;
    const dec = Engine.decideDay(date);
    const r = dec.readiness;
    const phase = dec.phase;
    const acw = Engine.acwr(date);
    const wk = Engine.weeklyReport(date);

    const line = [];
    line.push(`You are an elite strength & conditioning coach — the kind a professional athlete pays a fortune for. You coach ${p.name || 'this athlete'} through the KNCT Hybrid Apex System: a 32-week conjugate-block hybrid targeting elite sprint, middle-distance, endurance and jump qualities at once.`);
    line.push(`Your voice: direct, precise, evidence-based, encouraging but never fluffy. Reference the athlete's ACTUAL numbers below. Give specific, actionable guidance — loads, paces, rest, recovery, per-set cues. Keep replies tight (a few sentences to a short list) unless asked for depth. Never invent data you don't have; if you need a number, tell them what to log.`);
    line.push('');
    line.push('## Coaching system (fixed logic)');
    line.push('- Readiness gate: CMJ vs rolling baseline is primary (within 5% green / 5–10% amber / >10% red), with hard gates (RHR +7, sleep <6h, subjective <5/10, overnight bodyweight >2% drop, sharp pain). One gate → amber, two → red. Red on a high-CNS day = convert to Z1 + mobility, no CNS work.');
    line.push('- High/Low weekly architecture: CNS-intensive work clustered Mon/Wed/Fri; keep easy days genuinely easy (80/20).');
    line.push('- One primary quality drives each block; three secondaries held at minimum effective dose; one weekly diagnostic guards against drift.');
    line.push('- Per-set auto-regulation: power/speed stops when velocity drops past threshold; strength holds a target RPE band; plyos watch RSI.');
    line.push('');
    line.push('## Today');
    line.push(`- Date ${date}, ${dec.day}, ${dec.arch ? dec.arch.load + ' day' : ''}. Program week ${dec.wk ?? '—'} of 32, Phase ${phase.id}: ${phase.name} (${phase.driver}).${dec.deload ? ' DELOAD WEEK (~40% volume, intensity held).' : ''}`);
    if (r) {
      line.push(`- Readiness ${r.score}/100 (${r.band}). ${dec.headline}`);
      if (r.gates && r.gates.length) line.push(`- Hard gates triggered: ${r.gates.join('; ')}.`);
      r.components.forEach(c => line.push(`- ${c.key}: ${c.note}`));
    } else {
      line.push('- No morning readiness gate logged yet today.');
    }
    if (acw.ratio != null) line.push(`- Acute:chronic workload ${acw.ratio} (acute ${acw.acute}, chronic ${acw.chronic} AU).`);
    if (dec.prescribed) {
      const items = [...dec.prescribed.am.items, ...dec.prescribed.pm.items]
        .map(i => `${i.name} ${[i.sets, i.reps].filter(Boolean).join('×')}${i.load && i.load !== '—' ? ' @' + i.load : ''}`).join('; ');
      line.push(`- Prescribed today — AM: ${dec.prescribed.am.focus}. PM: ${dec.prescribed.pm.focus}. Movements: ${items || 'recovery'}.`);
    }
    // today's logged session so far
    const day = Store.getDay(date);
    if (day.session && day.session.exercises && day.session.exercises.length) {
      const logged = day.session.exercises.map(ex => {
        const sets = (ex.sets || []).filter(s => Object.keys(s).length).map(s =>
          [s.load && s.load + 'kg', s.reps && s.reps + 'r', s.rpe && 'RPE' + s.rpe, s.velocity && s.velocity + 'm/s', s.distance && s.distance + 'm', s.minutes && s.minutes + 'min'].filter(Boolean).join('/')).join(', ');
        return `${ex.name}${sets ? ' [' + sets + ']' : ''}`;
      }).join('; ');
      line.push(`- Logged so far today: ${logged}.`);
    }
    line.push('');
    line.push('## Goals (current → 32-wk checkpoint → North Star)');
    DATA.GOALS.forEach(g => {
      const pr = Engine.projectGoal(g);
      const cur = pr.status === 'ok' ? pr.current : g.current;
      const ck = g.checkpoint ? `${g.checkpoint[0]}–${g.checkpoint[1]}` : '—';
      const trend = pr.status === 'ok' && pr.trendPoints >= 2 ? ` (${pr.perWeek > 0 ? '+' : ''}${pr.perWeek}${g.unit}/wk${pr.etaCkWeeks != null ? ', ~' + pr.etaCkWeeks + 'wk to checkpoint' : ''})` : '';
      line.push(`- ${g.name}: ${cur ?? '—'}${g.unit} → ${ck} → ${g.northStar ?? '—'}${g.unit}${trend}. Limiters: ${g.limiters.join(', ')}.`);
    });
    line.push('');
    line.push('## This week vs plan');
    wk.items.forEach(it => line.push(`- ${it.label}: ${it.val}${it.unit} (target ${it.target[0]}–${it.target[1]}${it.unit}) — ${it.band}.`));
    if (p.criticalPower) {
      line.push('');
      line.push(`## Stryd power zones (CP ${p.criticalPower} W)`);
      DATA.STRYD_ZONES.forEach(z => line.push(`- ${z.id} ${z.name}: ${Math.round(z.pct[0] * p.criticalPower)}–${Math.round(z.pct[1] * p.criticalPower)} W`));
    }
    return line.join('\n');
  }

  /* ---- Stream a chat completion ---------------------------------------- */
  async function send(history, userText, { onDelta, onDone, onError }) {
    if (!enabled()) { onError && onError(new Error('No API key set')); return; }
    const messages = [...history.slice(-10), { role: 'user', content: userText }];
    const body = {
      model: model(),
      max_tokens: 1200,
      system: [{ type: 'text', text: buildSystem(UI.date), cache_control: { type: 'ephemeral' } }],
      messages,
      stream: true,
    };
    let acc = '';
    try {
      const res = await fetch(API, {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-api-key': Store.state.settings.aiKey,
          'anthropic-version': VERSION,
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify(body),
      });
      if (!res.ok) {
        let msg = `HTTP ${res.status}`;
        try { const e = await res.json(); msg = (e.error && e.error.message) || msg; } catch (_) {}
        throw new Error(msg);
      }
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const ln of lines) {
          const s = ln.trim();
          if (!s.startsWith('data:')) continue;
          const payload = s.slice(5).trim();
          if (payload === '[DONE]') continue;
          try {
            const ev = JSON.parse(payload);
            if (ev.type === 'content_block_delta' && ev.delta && ev.delta.type === 'text_delta') {
              acc += ev.delta.text; onDelta && onDelta(ev.delta.text, acc);
            } else if (ev.type === 'error') {
              throw new Error((ev.error && ev.error.message) || 'stream error');
            }
          } catch (_) { /* ignore partial */ }
        }
      }
      onDone && onDone(acc);
    } catch (err) {
      onError && onError(err);
    }
  }

  return { enabled, model, buildSystem, send };
})();

  <script>
/* ============================================================================
   notionsync.js — Push logs to the Notion dashboard.
   Notion's API blocks direct browser calls (CORS) and needs a secret token,
   so this offers two paths:
     1) CSV export per database (zero setup — import/merge into Notion).
     2) Auto-push via a user-deployed Cloudflare Worker proxy that holds the
        Notion token and adds CORS (see worker.js + README).
   Column names + database IDs match the databases created in the workspace.
   ========================================================================== */

const NotionSync = (() => {
  // Database IDs of the dashboard created in "KNCT Hybrid Apex System".
  const DB = {
    readiness:  'ee69e5cfd78e413088a5555984c3c90e',
    session:    '4cae33d7550d451fbafe523ead9c82d0',
    diagnostic: '99d0a7652c11469c9d702624d61418bf',
    baseline:   '495c0eeed8e64ef292eb0f51f4de4cd6',
  };

  const enabled = () => !!(Store.state.settings.notionUrl && Store.state.settings.notionKey);

  /* ---- Notion native property builders --------------------------------- */
  const P = {
    title: v => ({ title: [{ text: { content: String(v ?? '') } }] }),
    text:  v => ({ rich_text: [{ text: { content: String(v ?? '') } }] }),
    num:   v => ({ number: (v == null || v === '' || isNaN(v)) ? null : Number(v) }),
    date:  v => ({ date: v ? { start: v } : null }),
    sel:   v => ({ select: v ? { name: String(v) } : null }),
    check: v => ({ checkbox: !!v }),
  };

  /* ---- Summarize a logged session into the DB2 text columns ------------ */
  function summarizeSession(session) {
    const out = { lifts: [], sprints: [], cond: [], plyo: 0, rsi: 0 };
    (session.exercises || []).forEach(ex => {
      const sets = (ex.sets || []).filter(s => Object.keys(s).length);
      if (['strength', 'power', 'iso'].includes(ex.cat)) {
        const parts = sets.map(s => [s.load && s.load + 'kg', s.reps && '×' + s.reps, s.velocity && '@' + s.velocity + 'm/s', s.rpe && ' RPE' + s.rpe].filter(Boolean).join('')).join(', ');
        out.lifts.push(`${ex.name}${parts ? ' ' + parts : ''}`);
      } else if (ex.cat === 'speed') {
        const parts = sets.map(s => [s.distance && s.distance + 'm', s.reps && '×' + s.reps, s.time && ' ' + s.time + 's'].filter(Boolean).join('')).join(', ');
        out.sprints.push(`${ex.name}${parts ? ' ' + parts : ''}`);
      } else if (['zone2', 'threshold', 'vo2'].includes(ex.cat)) {
        const mins = sets.reduce((a, s) => a + (parseFloat(s.minutes) || 0), 0);
        out.cond.push(`${ex.name}${mins ? ' ' + mins + 'min' : ''}`);
      } else if (ex.cat === 'plyo') {
        sets.forEach(s => { out.plyo += parseFloat(s.contacts) || 0; out.rsi = Math.max(out.rsi, parseFloat(s.rsi) || 0); });
      }
    });
    return out;
  }

  /* ---- Build Notion page bodies from a day ----------------------------- */
  function readinessProps(date) {
    const day = Store.getDay(date); const w = day.wellness; if (!w) return null;
    const r = Engine.readiness(date);
    const subj = w.energy || w.mood || w.motivation ? Math.round(((((w.energy || 3) + (w.mood || 3) + (w.motivation || 3)) / 3 + ((6 - (w.soreness || 3)) + (6 - (w.stress || 3))) / 2) / 2) * 2 * 10) / 10 : null;
    // cmj vs baseline %
    let cmjPct = null;
    const hist = Store.testsFor('cmj').filter(t => t.date < date).map(t => t.value);
    if (typeof w.cmj === 'number' && hist.length >= 3) { const base = hist.slice(-7).reduce((a, b) => a + b, 0) / Math.min(7, hist.length); cmjPct = +(((w.cmj - base) / base) * 100).toFixed(1); }
    return {
      'Day': P.title(date), 'Date': P.date(date), 'HRV (ms)': P.num(w.hrv), 'Morning CMJ (cm)': P.num(w.cmj),
      'CMJ vs baseline %': P.num(cmjPct), 'Resting HR': P.num(w.rhr), 'Sleep (h)': P.num(w.sleepH),
      'Subjective (1-10)': P.num(subj), 'Bodyweight (kg)': P.num(w.bodyweightKg), 'Status': P.sel(r ? r.band : null),
    };
  }
  function sessionProps(date) {
    const day = Store.getDay(date); const s = day.session; if (!s || !(s.exercises || []).length) return null;
    const sum = summarizeSession(s); const phase = Engine.currentPhase(date); const arch = DATA.WEEK_ARCH.find(a => a.day === Engine.weekdayOf(date));
    return {
      'Session': P.title(`${date} · ${s.type || Engine.weekdayOf(date)}`), 'Date': P.date(date), 'Phase': P.num(phase.id),
      'Session type': P.text(arch ? arch.load : ''), 'Main lifts (load/velocity)': P.text(sum.lifts.join('; ')),
      'Sprint reps (dist/time/OVR)': P.text(sum.sprints.join('; ')), 'Plyo contacts': P.num(sum.plyo || null),
      'RSI': P.num(sum.rsi || null), 'Conditioning (min/HR/power)': P.text(sum.cond.join('; ')),
      'Session RPE': P.num(s.sRPE), 'Notes': P.text(s.notes || ''),
    };
  }

  /* ---- POST one page through the proxy --------------------------------- */
  async function push(dbId, properties) {
    const res = await fetch(Store.state.settings.notionUrl, {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-apex-key': Store.state.settings.notionKey },
      body: JSON.stringify({ parent: { database_id: dbId }, properties }),
    });
    if (!res.ok) { let m = `HTTP ${res.status}`; try { const e = await res.json(); m = (e.message || (e.error && e.error.message)) || m; } catch (_) {} throw new Error(m); }
    return res.json();
  }

  /* ---- Sync a day's readiness + session (idempotent via flags) --------- */
  async function syncDay(date, { force = false } = {}) {
    if (!enabled()) return { skipped: true };
    const day = Store.getDay(date); day.synced = day.synced || {};
    const done = [];
    const rp = readinessProps(date);
    if (rp && (force || !day.synced.readiness)) { await push(DB.readiness, rp); day.synced.readiness = true; done.push('readiness'); }
    const sp = sessionProps(date);
    if (sp && (force || !day.synced.session)) { await push(DB.session, sp); day.synced.session = true; done.push('session'); }
    Store.save();
    return { done };
  }

  /* ---- CSV export (zero setup) ----------------------------------------- */
  const esc = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  function toCSV(headers, rows) { return [headers.join(','), ...rows.map(r => r.map(esc).join(','))].join('\n'); }

  function readinessCSV() {
    const H = ['Day', 'Date', 'HRV (ms)', 'Morning CMJ (cm)', 'CMJ vs baseline %', 'Resting HR', 'Sleep (h)', 'Subjective (1-10)', 'Bodyweight (kg)', 'Status'];
    const rows = Store.allDaysSorted().filter(d => d.wellness).map(d => {
      const p = readinessProps(d.date);
      const val = (key, type) => { const o = p[key][type]; return type === 'number' ? (o ?? '') : type === 'title' || type === 'rich_text' ? (o[0] ? o[0].text.content : '') : type === 'date' ? (o ? o.start : '') : type === 'select' ? (o ? o.name : '') : ''; };
      return [val('Day', 'title'), val('Date', 'date'), val('HRV (ms)', 'number'), val('Morning CMJ (cm)', 'number'), val('CMJ vs baseline %', 'number'), val('Resting HR', 'number'), val('Sleep (h)', 'number'), val('Subjective (1-10)', 'number'), val('Bodyweight (kg)', 'number'), val('Status', 'select')];
    });
    return toCSV(H, rows);
  }
  function sessionCSV() {
    const H = ['Session', 'Date', 'Phase', 'Session type', 'Main lifts (load/velocity)', 'Sprint reps (dist/time/OVR)', 'Plyo contacts', 'RSI', 'Conditioning (min/HR/power)', 'Session RPE', 'Notes'];
    const rows = Store.allDaysSorted().filter(d => d.session && (d.session.exercises || []).length).map(d => {
      const p = sessionProps(d.date); const t = (k, ty) => { const o = p[k][ty]; return ty === 'number' ? (o ?? '') : ty === 'title' || ty === 'rich_text' ? (o[0] ? o[0].text.content : '') : ty === 'date' ? (o ? o.start : '') : ''; };
      return [t('Session', 'title'), t('Date', 'date'), t('Phase', 'number'), t('Session type', 'rich_text'), t('Main lifts (load/velocity)', 'rich_text'), t('Sprint reps (dist/time/OVR)', 'rich_text'), t('Plyo contacts', 'number'), t('RSI', 'number'), t('Conditioning (min/HR/power)', 'rich_text'), t('Session RPE', 'number'), t('Notes', 'rich_text')];
    });
    return toCSV(H, rows);
  }
  function download(name, text) {
    const blob = new Blob([text], { type: 'text/csv' }); const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = name; a.click(); URL.revokeObjectURL(url);
  }

  return { DB, enabled, syncDay, readinessCSV, sessionCSV, download };
})();

const UI = (() => {

  /* ---- Morning gate modal ---------------------------------------------- */

        <div class="field"><label>Resting HR</label><input type="number" id="ci-rhr" value="${w.rhr ?? ''}" placeholder="optional"></div></div>` : ''}
      ${scale('soreness', 'Muscle soreness (5 = wrecked)', true)}

    const pain = $('#ci-pain'); pain.onclick = () => { pain.dataset.on = pain.dataset.on === '1' ? '0' : '1'; pain.classList.toggle('on', pain.dataset.on === '1'); };
