<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0a0e14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="VALUE LOOP" />
  <title>VALUE LOOP OS — the operating system that tells a business what to fix next</title>
  <style>
/* ============================================================================
   VALUE LOOP OS — dark, dense, executive. Mobile-first, safe-area aware.
   Shares the APEX palette so the two apps feel like one house.
   ========================================================================== */
:root{
  --bg:#0a0e14; --bg2:#111722; --card:#151c28; --card2:#1b2432;
  --line:#232d3d; --txt:#eef2f8; --muted:#8b96a8; --muted2:#5c6779;
  --green:#3ddc84; --amber:#ffb020; --red:#ff4d5e; --blue:#4da6ff;
  --accent:#00e0b8; --accent2:#7b6cff;
  --radius:18px; --radius-sm:12px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
  font-size:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;
}
#app{display:flex;flex-direction:column;min-height:100%;max-width:760px;margin:0 auto}

/* Top bar */
#topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--safe-top) + 12px) 18px 12px;
  background:linear-gradient(180deg,var(--bg) 72%,transparent);backdrop-filter:blur(8px)}
.brand{font-weight:800;letter-spacing:.14em;font-size:.95rem}
.brand .logo{color:var(--accent);margin-right:4px}
.brand em{font-style:normal;color:var(--muted2);letter-spacing:.06em;font-weight:600;margin-left:6px}
.phase-pill{background:var(--card2);border:1px solid var(--line);color:var(--muted);
  padding:6px 12px;border-radius:999px;font-size:.72rem;font-weight:700;cursor:pointer}
.phase-pill.green{color:var(--green);border-color:rgba(61,220,132,.4)}
.phase-pill.amber{color:var(--amber);border-color:rgba(255,176,32,.4)}
.phase-pill.red{color:var(--red);border-color:rgba(255,77,94,.4)}

#view{flex:1;padding:4px 16px 104px;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* Tab bar */
#tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;max-width:760px;margin:0 auto;
  padding:6px 4px calc(var(--safe-bot) + 6px);background:rgba(12,16,23,.94);
  backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tab{flex:1;background:none;border:0;color:var(--muted2);display:flex;flex-direction:column;
  align-items:center;gap:3px;padding:6px 0;font-size:.62rem;font-weight:600;cursor:pointer;transition:color .15s}
.tab .ic{font-size:1.1rem;line-height:1}
.tab.active{color:var(--accent)}

/* Cards & type */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:14px 0}
.card.tight{padding:14px}
.card h3{margin:0 0 4px;font-size:.95rem}
.card .sub,.sub{color:var(--muted);font-size:.78rem;margin:4px 0 0;line-height:1.5}
.muted{color:var(--muted)}
.small{font-size:.76rem;line-height:1.55}
.section-title{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2);
  font-weight:700;margin:22px 4px 2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.arrow{color:var(--muted2);margin:0 2px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}

/* Buttons & inputs */
.btn{background:var(--accent);color:#03231e;border:0;border-radius:999px;padding:10px 16px;
  font-weight:700;font-size:.8rem;cursor:pointer}
.btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.tiny{padding:6px 11px;font-size:.72rem}
.btn.danger{color:var(--red);border-color:rgba(255,77,94,.4)}
input,select,textarea{background:var(--bg2);border:1px solid var(--line);color:var(--txt);
  border-radius:var(--radius-sm);padding:10px 12px;font-size:.88rem;font-family:inherit;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical}
.fld{display:block;margin:10px 0}
.fld .f-l{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-bottom:5px}
.fld .f-l em{font-style:normal;color:var(--muted2)}
.fld .f-h{display:block;font-size:.7rem;color:var(--muted2);margin-top:5px;line-height:1.45}

/* Period bar */
.periodbar{display:flex;gap:8px;align-items:center;margin:12px 0 0}
.periodbar select{flex:1;text-align:center;font-weight:700}
.pbtn{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:var(--radius-sm);
  width:42px;height:42px;font-size:1.1rem;cursor:pointer}

/* Ring */
.ring-wrap{display:flex;justify-content:center;padding:6px 0 2px}
.ring{position:relative;width:180px;height:180px}
.ring svg{transform:rotate(-90deg)}
.ring .score{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .score .num{font-size:3rem;font-weight:800;line-height:1;letter-spacing:-.03em}
.ring .score .lbl{font-size:.6rem;letter-spacing:.2em;color:var(--muted);margin-top:6px}
.loopline{text-align:center;font-size:.6rem;letter-spacing:.1em;color:var(--muted2);
  font-weight:700;margin:6px 0 16px}

/* Pillars */
.pillars{display:flex;flex-direction:column;gap:12px}
.pillar.clickable{cursor:default}
.pl-head{display:flex;align-items:baseline;gap:8px;font-size:.82rem;margin-bottom:5px}
.pl-head b{font-size:.95rem;letter-spacing:.06em}
.pl-head span{color:var(--muted);flex:1}
.pl-head em{font-style:normal;font-weight:800}
.pl-q{font-size:.68rem;color:var(--muted2);margin-top:5px}
.bar{background:var(--card2);border-radius:999px;height:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;transition:width .4s ease}

/* Constraint banner */
.constraint,.verdict{background:linear-gradient(150deg,#1a2434,#151c28);border:1px solid var(--accent2);
  border-radius:var(--radius);padding:18px;margin:14px 0}
.c-tag,.v-tag{font-size:.6rem;letter-spacing:.18em;color:var(--accent2);font-weight:800}
.c-name{font-size:1.35rem;font-weight:800;margin:8px 0 4px;letter-spacing:-.02em}
.c-line{color:var(--muted);font-size:.85rem}
.c-money,.v-money{margin-top:10px;font-size:.85rem;color:var(--txt);background:rgba(0,224,184,.09);
  border-radius:var(--radius-sm);padding:9px 12px}
.c-money b,.v-money b{color:var(--accent)}
.constraint .btn{margin-top:14px}
.v-h{font-size:1.25rem;font-weight:800;margin:10px 0 6px;letter-spacing:-.02em}
.v-p{color:var(--muted);font-size:.86rem}
.v-def{margin-top:12px;font-size:.72rem;color:var(--muted2);line-height:1.5}

/* KPI grid */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:8px}
.kpis.two{grid-template-columns:1fr 1fr}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px}
.k-lbl{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2);font-weight:700}
.k-val{font-size:1.35rem;font-weight:800;margin-top:5px;letter-spacing:-.02em}
.k-sub{font-size:.7rem;color:var(--muted);margin-top:3px}
.chip{font-size:.66rem;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--card2);color:var(--muted)}
.chip.up{color:var(--green);background:rgba(61,220,132,.12)}
.chip.down{color:var(--red);background:rgba(255,77,94,.12)}
.chip.flat{color:var(--muted)}

/* Metric rows */
.mlist{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  margin:8px 0 0;overflow:hidden}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.mrow:last-child{border-bottom:0}
.mrow:active{background:var(--card2)}
.m-main{flex:1;min-width:0}
.m-lbl{font-size:.85rem;font-weight:600}
.m-sub{font-size:.68rem;color:var(--muted2);margin-top:2px}
.m-val{text-align:right}
.m-val .v{font-size:1rem;font-weight:800}
.m-score{width:38px;text-align:center;font-weight:800;font-size:.85rem;border-radius:8px;padding:5px 0;background:var(--card2)}
.green,.v.green{color:var(--green)} .amber,.v.amber{color:var(--amber)} .red,.v.red{color:var(--red)}
.m-score.green{background:rgba(61,220,132,.12)} .m-score.amber{background:rgba(255,176,32,.12)}
.m-score.red{background:rgba(255,77,94,.12)} .m-score.none{color:var(--muted2)}

/* Alerts */
.alerts{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.alert{border-radius:var(--radius-sm);padding:12px 14px;border-left:3px solid var(--muted2);background:var(--card)}
.alert.red{border-color:var(--red);background:rgba(255,77,94,.07)}
.alert.amber{border-color:var(--amber);background:rgba(255,176,32,.06)}
.alert.info{border-color:var(--blue);background:rgba(77,166,255,.06)}
.a-t{font-weight:700;font-size:.85rem}
.a-b{font-size:.76rem;color:var(--muted);margin-top:3px;line-height:1.5}

/* Funnel */
.funnel{margin:14px 0 6px}
.f-stage{position:relative;margin:2px 0}
.f-bar{height:34px;border-radius:8px;background:linear-gradient(90deg,var(--accent),var(--accent2));opacity:.32}
.f-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.f-txt b{font-size:.8rem;font-weight:600}
.f-txt em{font-style:normal;font-weight:800;font-size:.9rem}
.f-conv{font-size:.66rem;color:var(--muted2);text-align:right;padding:2px 12px;font-weight:700}
.f-conv span{color:var(--muted2);opacity:.7;font-weight:500;margin-left:5px}

/* Fail bars */
.fbar{display:grid;grid-template-columns:1fr 90px 70px;gap:10px;align-items:center;margin:8px 0;font-size:.78rem}
.fbar .f-n{text-align:right;color:var(--muted);font-size:.72rem}

/* Tables */
.tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin:8px 0}
.tbl{width:100%;border-collapse:collapse;font-size:.78rem;min-width:420px}
.tbl th{text-align:left;font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);
  padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right}

/* Segment tabs */
.segtabs{display:flex;gap:6px;margin:12px 0 0;overflow-x:auto}
.segtabs.wide{margin:14px 0 4px}
.segtab{background:var(--card2);border:1px solid var(--line);color:var(--muted);border-radius:999px;
  padding:7px 14px;font-size:.74rem;font-weight:700;cursor:pointer;text-transform:capitalize;white-space:nowrap}
.segtab.on{background:var(--accent);color:#03231e;border-color:transparent}

/* Network flow */
.netflow{display:flex;gap:8px;margin:14px 0}
.netflow>div{flex:1;background:var(--card2);border-radius:var(--radius-sm);padding:10px;text-align:center}
.netflow em{display:block;font-style:normal;font-size:1.2rem;font-weight:800}
.netflow span{font-size:.62rem;color:var(--muted2);text-transform:uppercase;letter-spacing:.08em}
.netflow .plus em{color:var(--green)} .netflow .minus em{color:var(--red)} .netflow .eq em{color:var(--accent)}

/* Levers */
.lever{border-bottom:1px solid var(--line);padding:12px 0}
.lever:last-child{border-bottom:0}
.lv-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin-bottom:7px}
.lv-name{font-size:.86rem;font-weight:600;display:flex;align-items:center}
.lv-money{font-weight:800;color:var(--accent);font-size:.92rem}
.lv-sub{font-size:.7rem;color:var(--muted2);margin-top:6px}
.lv-body{margin-top:12px;animation:fadein .2s ease}
.def{font-size:.75rem;color:var(--muted);line-height:1.55;margin:0 0 10px}
.rx-title{font-size:.62rem;letter-spacing:.16em;color:var(--accent2);font-weight:800;margin:12px 0 6px}
.rx{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px}
.rx-a{font-size:.83rem;font-weight:600;line-height:1.45}
.rx-w{font-size:.73rem;color:var(--muted);margin-top:5px;line-height:1.5}
.rx-meta{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.66rem;color:var(--muted2);
  text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.rx-meta .btn{margin-left:auto}

/* Interventions */
.ivn{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent2);
  border-radius:var(--radius-sm);padding:13px;margin:8px 0}
.ivn.worked{border-left-color:var(--green)} .ivn.worse{border-left-color:var(--red)}
.ivn\.no-effect,.ivn.no-effect{border-left-color:var(--muted2)}
.iv-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem}
.iv-a{font-size:.78rem;color:var(--muted);margin-top:5px;line-height:1.5}
.iv-m{font-size:.68rem;color:var(--muted2);margin-top:6px}
.pill{font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;
  padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--muted)}
.pill.running{color:var(--accent2)} .pill.worked{color:var(--green);background:rgba(61,220,132,.12)}
.pill.worse{color:var(--red);background:rgba(255,77,94,.12)}
.pill.live{color:var(--green)} .pill.partial{color:var(--amber)} .pill.planned{color:var(--muted2)}
.pill.green{color:var(--green)} .pill.amber{color:var(--amber)} .pill.red{color:var(--red)}

/* People */
.plist .prow{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.plist .prow:last-child{border-bottom:0}
.p-ltv{font-weight:800;font-size:.85rem;color:var(--accent)}
.risklist .rrow{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:11px 0;border-bottom:1px solid var(--line)}
.risklist .rrow:last-child{border-bottom:0}
.pform{max-height:52vh;overflow-y:auto;padding-right:4px}

/* Benchmarks */
.bmrow{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.bmrow:last-child{border-bottom:0}
.bm-l{font-size:.82rem;font-weight:600}
.bm-l .f-h{display:block;font-weight:400;font-size:.7rem;color:var(--muted2);margin-top:4px;line-height:1.5}
.bm-in{display:flex;gap:8px;align-items:flex-end}
.bm-in label{flex:1;font-size:.6rem;color:var(--muted2);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.bm-in input{width:100%;padding:8px 10px;font-size:.82rem;margin-top:4px}
.bm-in .unit{font-size:.75rem;color:var(--muted2);padding-bottom:10px;width:16px}

/* Domain registry */
.dom{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;margin:8px 0}
.d-top{display:flex;align-items:center;gap:8px;font-size:.85rem}
.d-top b{flex:1}
.d-n{color:var(--muted2);font-size:.7rem;font-weight:800;width:22px}
.d-f{font-size:.7rem;color:var(--muted2);margin-top:6px;line-height:1.6}

/* Empty state */
.empty p{margin:0 0 4px;color:var(--muted);font-size:.85rem;line-height:1.55}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(4,7,11,.72);backdrop-filter:blur(3px);z-index:40}
.modal{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(560px,calc(100vw - 28px));max-height:86vh;overflow-y:auto;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;
  animation:fadein .18s ease}
.modal h3{margin:0 0 6px}
.md-head{display:flex;align-items:center;gap:8px;font-size:1rem;margin-bottom:8px}
.md-head b{flex:1}
.mdgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.spark{width:100%;height:44px;background:var(--bg2);border-radius:var(--radius-sm);padding:6px;margin-bottom:6px}
.fgroup{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2);
  font-weight:800;margin:18px 0 -4px}

</style>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand"><span class="logo">◍</span> VALUE LOOP <em id="coName">—</em></div>
      <div id="scorePill" class="phase-pill" role="button" tabindex="0">—</div>
    </header>

    <main id="view"><!-- rendered by ui.js --></main>

    <nav id="tabbar">
      <button class="tab" data-tab="company">  <span class="ic">◍</span><span>Company</span></button>
      <button class="tab" data-tab="acquire">  <span class="ic">◉</span><span>Acquire</span></button>
      <button class="tab" data-tab="success">  <span class="ic">✦</span><span>Success</span></button>
      <button class="tab" data-tab="retain">   <span class="ic">∞</span><span>Retain</span></button>
      <button class="tab" data-tab="diagnose"> <span class="ic">⚑</span><span>Diagnose</span></button>
      <button class="tab" data-tab="data">     <span class="ic">▤</span><span>Data</span></button>
    </nav>
  </div>

  <div id="modalRoot"></div>

  <script>
/* ============================================================================
   schema.js — THE DICTIONARY.

   Everything the system knows how to measure lives here:
     PILLARS   — the VALUE LOOP (V·A·L·U·E) and the question each one answers
     FIELDS    — what a human types in each period (the manual layer)
     METRICS   — what the machine derives, with its benchmark and its weight
     LEVERS    — the subset of metrics that actually move money, wired into
                 the funnel model in engine.js
     DOMAINS   — the full 52-domain backend registry (collect everything;
                 show the CEO only what currently matters)

   Definitions are written down ONCE, here, because inconsistent definitions
   are what make funnel numbers unreliable in the first place.
   ========================================================================== */

const Schema = (() => {

  /* ---- The loop --------------------------------------------------------- */
  const PILLARS = [
    { id:'V', name:'Visibility',    q:'Where is attention coming from?',        color:'#4da6ff' },
    { id:'A', name:'Acquisition',   q:'Where is money leaking?',                color:'#00e0b8' },
    { id:'L', name:'Lifetime Value',q:'Are customers staying and buying more?', color:'#7b6cff' },
    { id:'U', name:'User Outcome',  q:'Are customers getting results?',         color:'#ffb020' },
    { id:'E', name:'Efficiency',    q:'Does the machine keep its margin?',      color:'#3ddc84' },
  ];
  const pillar = id => PILLARS.find(p => p.id === id);

  /* ---- What a human enters each period ---------------------------------- *
     Keep this list SHORT. If a number is not typed in under 20 minutes a week
     it will not get typed in at all. Everything else lives in DOMAINS until
     it earns a place here.                                                   */
  const FIELDS = [
    // ---------------- V — attention -------------------------------------
    { id:'views',            label:'Content views',        pillar:'V', group:'Attention', unit:'#',
      help:'Total views across every account for the period. One number.' },
    { id:'reach',            label:'Unique reach',         pillar:'V', group:'Attention', unit:'#',
      help:'Unique accounts reached. Blank if the platform will not give it.' },
    { id:'profileVisits',    label:'Profile visits',       pillar:'V', group:'Attention', unit:'#' },
    { id:'ctaClicks',        label:'CTA / link clicks',    pillar:'V', group:'Attention', unit:'#',
      help:'Clicks on the thing that starts the funnel (LINE, application, DM CTA).' },
    { id:'followersNet',     label:'Net new followers',    pillar:'V', group:'Attention', unit:'#' },
    { id:'lineMessagesSent', label:'LINE broadcasts sent', pillar:'V', group:'LINE',      unit:'#' },
    { id:'lineFriendsNew',   label:'New LINE friends',     pillar:'V', group:'LINE',      unit:'#' },
    { id:'lineTargetReach',  label:'LINE target reach',    pillar:'V', group:'LINE',      unit:'#',
      help:'Reachable friends at period end — the only LINE number that pays.' },
    { id:'lineBlocks',       label:'LINE blocks',          pillar:'V', group:'LINE',      unit:'#' },

    // ---------------- A — acquisition ------------------------------------
    { id:'leads',            label:'New leads',            pillar:'A', group:'Funnel', unit:'#',
      help:'DEFINITION: a person who gave you a way to contact them this period. Not a follower.' },
    { id:'leadsReferral',    label:'…of which referred',   pillar:'A', group:'Funnel', unit:'#' },
    { id:'applications',     label:'Applications completed',pillar:'A',group:'Funnel', unit:'#' },
    { id:'applicationsQual', label:'…qualified',           pillar:'A', group:'Funnel', unit:'#',
      help:'Passed your qualification bar — not merely submitted.' },
    { id:'meetingsBooked',   label:'Meetings booked',      pillar:'A', group:'Funnel', unit:'#' },

  /* ---- Formatting -------------------------------------------------------- */
  function fmt(v, kind) {
    if (v == null || (typeof v === 'number' && !isFinite(v))) return '—';
    switch (kind) {
      case 'pct':  return (v * 100).toFixed(v < 0.1 ? 1 : 0) + '%';
      case 'yen':  return yen(v);
      case 'x':    return v.toFixed(1) + '×';
      case 'mo':   return v.toFixed(1) + ' mo';
      case 'h':    return Math.round(v) + ' h';
      case 'num':  return Math.abs(v) >= 100 ? Math.round(v).toLocaleString() : (Math.round(v * 100) / 100).toString();
      default:     return Math.round(v).toLocaleString();
    }
  }
  function yen(v) {
    const n = Math.round(v), a = Math.abs(n), s = n < 0 ? '-' : '';
    if (a >= 100000000) return s + '¥' + (a / 100000000).toFixed(2) + '億';
    if (a >= 10000)     return s + '¥' + (a / 10000).toFixed(a >= 1000000 ? 0 : 1) + '万';
    return s + '¥' + a.toLocaleString();
  }
  function fmtField(v, unit) {
    if (v == null || v === '') return '—';
    return unit === '¥' ? yen(v) : Math.round(v).toLocaleString() + (unit === 'h' ? ' h' : '');
  }

  <script>
/* ============================================================================
   store.js — Local persistence. Periods, people, interventions, benchmarks.
   Everything stays in the browser (localStorage), private to the device,
   exportable as JSON or CSV. No accounts, no server, works on a plane.
   ========================================================================== */

const Store = (() => {
  const KEY = 'valueloop_os_v1';

  const DEFAULT = {
    company: { name:'KNCT', currency:'JPY', cadence:'month', fiscalStart:'2026-01' },
    periods: {},          // id -> { id, type, startISO, endISO, label, inputs:{}, notes }
    people:  {},          // id -> master record (section 1)
    interventions: [],    // the PRESCRIBE → TRACK ledger
    benchmarks: {},       // metricId -> { target, floor }  (overrides Schema defaults)
    focus: [],            // metric ids the CEO has pinned to screen 1
    settings: { demo:false },
  };

  let state = load();

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return structuredClone(DEFAULT);
      const p = JSON.parse(raw);
      return { ...structuredClone(DEFAULT), ...p,
        company:  { ...DEFAULT.company,  ...(p.company  || {}) },
        settings: { ...DEFAULT.settings, ...(p.settings || {}) } };
    } catch (e) { console.warn('Store reset', e); return structuredClone(DEFAULT); }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { console.error('Save failed — storage full?', e); }
  }

  /* ---- Period identity --------------------------------------------------- */
  const pad = n => String(n).padStart(2, '0');

  function isoWeek(d) {                       // ISO-8601 week number
    const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const day = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - day);
    const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return { year: t.getUTCFullYear(), week: Math.ceil(((t - y0) / 86400000 + 1) / 7) };
  }
  function weekBounds(year, week) {
    const jan4 = new Date(Date.UTC(year, 0, 4));
    const mon = new Date(jan4);
    mon.setUTCDate(jan4.getUTCDate() - ((jan4.getUTCDay() || 7) - 1) + (week - 1) * 7);
    const sun = new Date(mon); sun.setUTCDate(mon.getUTCDate() + 6);
    return { startISO: mon.toISOString().slice(0, 10), endISO: sun.toISOString().slice(0, 10) };
  }
  function periodIdFor(dateISO, type) {
    const d = new Date(dateISO + 'T12:00:00');
    if (type === 'week') { const { year, week } = isoWeek(d); return `${year}-W${pad(week)}`; }
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  }
  function boundsFor(id) {
    if (id.includes('W')) {
      const [y, w] = id.split('-W');
      return weekBounds(+y, +w);
    }
    const [y, m] = id.split('-').map(Number);
    const end = new Date(Date.UTC(y, m, 0));
    return { startISO: `${y}-${pad(m)}-01`, endISO: end.toISOString().slice(0, 10) };
  }
  function labelFor(id) {
    if (id.includes('W')) { const [y, w] = id.split('-W'); return `Week ${+w} · ${y}`; }
    const [y, m] = id.split('-');
    return new Date(+y, +m - 1, 1).toLocaleString('en', { month:'long' }) + ' ' + y;
  }
  // A month is 1.0; a week is 7/30.44 of a month. Used to normalise churn.
  const monthsIn = id => id.includes('W') ? 7 / 30.44 : 1;

  const todayISO = () => new Date().toISOString().slice(0, 10);

  /* ---- Periods ----------------------------------------------------------- */
  function ensurePeriod(id) {
    if (!state.periods[id]) {
      const b = boundsFor(id);
      state.periods[id] = { id, type: id.includes('W') ? 'week' : 'month',
        startISO:b.startISO, endISO:b.endISO, label:labelFor(id), inputs:{}, notes:'' };
      save();
    }
    return state.periods[id];
  }
  function setInput(id, fieldId, value) {
    const p = ensurePeriod(id);
    if (value === '' || value == null || (typeof value === 'number' && isNaN(value))) delete p.inputs[fieldId];
    else p.inputs[fieldId] = Number(value);
    save();
  }
  function setNotes(id, notes) { ensurePeriod(id).notes = notes; save(); }
  function deletePeriod(id) { delete state.periods[id]; save(); }

  const periodIds  = () => Object.keys(state.periods).sort();
  const periods    = () => periodIds().map(id => state.periods[id]);
  function currentId() {
    const ids = periodIds();
    const nowId = periodIdFor(todayISO(), state.company.cadence);
    if (state.periods[nowId]) return nowId;
    return ids.length ? ids[ids.length - 1] : nowId;
  }
  function previousId(id) {
    const ids = periodIds(); const i = ids.indexOf(id);
    return i > 0 ? ids[i - 1] : null;
  }
  function trailing(id, n) {                   // the n periods up to and including id
    const ids = periodIds(); const i = ids.indexOf(id);
    return (i < 0 ? ids.slice(-n) : ids.slice(Math.max(0, i - n + 1), i + 1)).map(x => state.periods[x]);
  }

  /* ---- People (section 1 — the spine) ------------------------------------ */
  function blankPerson() {
    return {
      id: 'P' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
      name:'', contact:'', source:'', campaign:'', cohort:'', salesperson:'', leader:'',
      dateLead:'', dateCall:'', datePurchase:'',
      price:0, collected:0, refunded:0,
      baselineIncome:0, currentIncome:0,
      status:'lead',            // lead · customer · active · graduated · churned · lost
      outcome:'none',           // none · implemented · firstClient · result100k · result300k · result1m
      dateFirstClient:'', dateFirstResult:'',
      network:'no',             // no · invited · joined · churned
      networkMonths:0, networkFee:0, expansion:0,
      referrals:0, caseStudy:false, certified:false,
      riskFlags:[],             // see Engine.riskScore
      failReason:'', churnReason:'', notes:'',
    };
  }
  function upsertPerson(rec) { state.people[rec.id] = { ...blankPerson(), ...rec }; save(); return state.people[rec.id]; }
  function deletePerson(id) { delete state.people[id]; save(); }
  const people = () => Object.values(state.people);

  /* ---- Interventions (PRESCRIBE → TRACK) --------------------------------- */
  function addIntervention(rx) {
    state.interventions.push({
      id: 'X' + Date.now().toString(36),
      created: todayISO(),
      periodId: rx.periodId, metricId: rx.metricId,
      action: rx.action, owner: rx.owner || '', horizon: rx.horizon || '',
      baseline: rx.baseline == null ? null : Number(rx.baseline),
      target:   rx.target   == null ? null : Number(rx.target),
      valueAtStake: rx.valueAtStake || 0,
      status: 'running', verdict:'', reviewedPeriodId:'', delta:null,
    });
    save();
  }
  function updateIntervention(id, patch) {
    const x = state.interventions.find(i => i.id === id);
    if (x) { Object.assign(x, patch); save(); }
  }
  function deleteIntervention(id) {
    state.interventions = state.interventions.filter(i => i.id !== id); save();
  }

  /* ---- Benchmarks & focus ------------------------------------------------ */
  function benchmark(metricId) {
    const m = Schema.metric(metricId) || {};
    const o = state.benchmarks[metricId] || {};
    return { target: o.target != null ? o.target : m.target,
             floor:  o.floor  != null ? o.floor  : m.floor };
  }
  function setBenchmark(metricId, target, floor) {
    state.benchmarks[metricId] = { target:Number(target), floor:Number(floor) }; save();
  }
  function resetBenchmark(metricId) { delete state.benchmarks[metricId]; save(); }
  function toggleFocus(metricId) {
    const i = state.focus.indexOf(metricId);
    if (i >= 0) state.focus.splice(i, 1); else state.focus.push(metricId);
    save();
  }

  /* ---- Company ----------------------------------------------------------- */
  function setCompany(patch) { state.company = { ...state.company, ...patch }; save(); }

  /* ---- Backup ------------------------------------------------------------ */
  function exportJSON() { return JSON.stringify(state, null, 2); }
  function importJSON(str) {
    const p = JSON.parse(str);
    state = { ...structuredClone(DEFAULT), ...p }; save();
  }
  function reset() { state = structuredClone(DEFAULT); save(); }

  return {
    get state() { return state; },
    save, periodIdFor, boundsFor, labelFor, monthsIn, todayISO,
    ensurePeriod, setInput, setNotes, deletePeriod, periods, periodIds,
    currentId, previousId, trailing,
    blankPerson, upsertPerson, deletePerson, people,
    addIntervention, updateIntervention, deleteIntervention,
    benchmark, setBenchmark, resetBenchmark, toggleFocus, setCompany,
    exportJSON, importJSON, reset,
  };
})();

  <script>
/* ============================================================================
   engine.js — MEASURE → SCORE → FIND CONSTRAINT.

   Three things happen here:
     1. MEASURE  every derived metric for a period from the typed inputs
     2. SCORE    each metric 0–100 against its benchmark, roll up to V/A/L/U/E
     3. MODEL    the funnel end-to-end so a gap can be quoted in yen, not in
                 percentage points — that is what turns a dashboard into a
                 decision.
   ========================================================================== */

const Engine = (() => {

  /* How the loop feeds itself. Stated openly because every projection below
     depends on it, and an assumption you cannot see is a lie you cannot audit. */
  const LOOP = {
    referralElasticity: 1.0,   // referrals move 1:1 with the 90-day result rate
    networkElasticity:  0.5,   // Network conversion moves at half the rate
  };

  const clamp01 = x => Math.max(0, Math.min(1, x));
  const num = v => (typeof v === 'number' && isFinite(v)) ? v : null;
  const median = a => { if (!a.length) return null; const s=[...a].sort((x,y)=>x-y), h=s.length>>1;
    return s.length % 2 ? s[h] : (s[h-1]+s[h])/2; };
  function pct(a, q) { if (!a.length) return null; const s=[...a].sort((x,y)=>x-y);
    return s[Math.min(s.length-1, Math.floor(q*(s.length-1)))]; }

  /* ---- 1. MEASURE -------------------------------------------------------- */
  function metricsFor(periodId) {
    const p = Store.state.periods[periodId];
    const inputs = p ? p.inputs : {};
    const ctx = { monthsInPeriod: Store.monthsIn(periodId), periodId };
    const m = {};
    Schema.METRICS.forEach(def => {
      let v = null;
      try { v = def.fn(inputs, m, ctx); } catch (e) { v = null; }
      m[def.id] = num(v);
    });
    return { inputs, metrics: m, ctx };
  }

  /* ---- 2. SCORE ---------------------------------------------------------- */
  function scoreOf(metricId, value) {
    if (value == null) return null;
    const b = Store.benchmark(metricId), d = Schema.metric(metricId);
    if (!d || b.target == null || b.floor == null) return null;
    const s = d.dir === 'down'
      ? (b.floor - value) / (b.floor - b.target)
      : (value - b.floor) / (b.target - b.floor);
    return Math.round(clamp01(s) * 100);
  }
  const band = s => s == null ? 'none' : s >= 75 ? 'green' : s >= 45 ? 'amber' : 'red';

  function assess(periodId) {
    const { inputs, metrics } = metricsFor(periodId);
    const scores = {};
    Schema.METRICS.forEach(d => scores[d.id] = scoreOf(d.id, metrics[d.id]));

    const pillars = Schema.PILLARS.map(pl => {
      const rows = Schema.metricsOf(pl.id)
        .map(d => ({ def:d, value:metrics[d.id], score:scores[d.id] }))
        .filter(r => r.score != null);
      const wSum = rows.reduce((a, r) => a + r.def.weight, 0);
      const score = wSum ? Math.round(rows.reduce((a, r) => a + r.score * r.def.weight, 0) / wSum) : null;
      return { ...pl, score, band: band(score), rows,
               coverage: rows.length / Schema.metricsOf(pl.id).length };
    });
    const scored = pillars.filter(p => p.score != null);
    const overall = scored.length ? Math.round(scored.reduce((a, p) => a + p.score, 0) / scored.length) : null;

    return { periodId, inputs, metrics, scores, pillars, overall,
             completeness: completeness(inputs) };
  }

  function completeness(inputs) {
    const filled = Schema.FIELDS.filter(f => inputs[f.id] != null).length;
    return { filled, total: Schema.FIELDS.length, pct: filled / Schema.FIELDS.length };
  }

  /* ---- 3. THE MODEL ------------------------------------------------------ *
     Every lever in one equation, so moving any one of them produces a yen
     number instead of an opinion.                                            */
  const LEVERS = [
    'leadRate','appRate','qualRate','bookRate','showRate','closeRate',
    'avgPrice','collectionRate','networkConv','retentionMonths',
    'expansionPerCust','successRate','referralRate',
  ];

  function baseline(periodId) {
    const { inputs, metrics } = metricsFor(periodId);
    // Fall back to the trailing average when a period is thin, so one blank
    // field cannot make the model claim the business earns nothing.
    const trail = Store.trailing(periodId, 4).map(p => metricsFor(p.id).metrics);
    const avg = id => { const v = trail.map(t => t[id]).filter(x => x != null);
      return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
    const pick = (id, dflt) => metrics[id] != null ? metrics[id] : (avg(id) != null ? avg(id) : dflt);

    return {
      views:           inputs.views || 0,
      studentsActive:  inputs.studentsActive || 0,
      networkFee:      inputs.networkFee || 0,
      leadRate:        pick('leadRate', 0.01),
      appRate:         pick('appRate', 0.2),
      qualRate:        pick('qualRate', 0.5),
      bookRate:        pick('bookRate', 0.5),
      showRate:        pick('showRate', 0.7),
      closeRate:       pick('closeRate', 0.2),
      avgPrice:        pick('avgPrice', 0),
      collectionRate:  pick('collectionRate', 1),
      refundRate:      pick('refundRate', 0),
      networkConv:     pick('networkConv', 0),
      retentionMonths: pick('retentionMonths', 0),
      expansionPerCust:pick('expansionPerCust', 0),
      successRate:     pick('successRate', 0),
      referralRate:    pick('referralRate', 0),
      leadsActual:     inputs.leads != null ? inputs.leads : null,
    };
  }

  function project(base, overrides) {
    const v = { ...base, ...(overrides || {}) };
    // The loop: results → proof → referrals → leads you did not pay for.
    const successRatio = base.successRate ? v.successRate / base.successRate : 1;
    const referralRate = v.referralRate * (1 + (successRatio - 1) * LOOP.referralElasticity);
    const networkConv  = v.networkConv  * (1 + (successRatio - 1) * LOOP.networkElasticity);

    const paidLeads     = v.views * v.leadRate;
    const referralLeads = v.studentsActive * referralRate;
    const leads         = paidLeads + referralLeads;
    const apps      = leads * v.appRate;
    const qualified = apps * v.qualRate;
    const booked    = qualified * v.bookRate;
    const attended  = booked * v.showRate;
    const customers = attended * v.closeRate;

    const frontCash = customers * v.avgPrice * v.collectionRate * (1 - v.refundRate);
    const recurring = customers * networkConv * v.networkFee * v.retentionMonths;
    const expansion = customers * v.expansionPerCust;

    return { leads, paidLeads, referralLeads, apps, qualified, booked, attended, customers,
             frontCash, recurring, expansion,
             value: frontCash + recurring + expansion,
             ltv: customers ? (frontCash + recurring + expansion) / customers : 0 };
  }

  /* What each lever is worth if it reaches its benchmark, everything else held. */
  function leverImpact(periodId) {
    const base = baseline(periodId);
    const now  = project(base);
    const out  = [];
    LEVERS.forEach(id => {
      const d = Schema.metric(id); if (!d) return;
      const b = Store.benchmark(id);
      const cur = base[id];
      if (cur == null || b.target == null) return;
      const better = d.dir === 'down' ? cur > b.target : cur < b.target;
      if (!better) return;                       // already at or past benchmark
      const at = project(base, { [id]: b.target });
      const gain = at.value - now.value;
      if (!(gain > 0)) return;
      out.push({ metricId:id, label:d.label, pillar:d.pillar, current:cur, target:b.target,
                 score:scoreOf(id, cur), gain, gainPct: now.value ? gain / now.value : null,
                 fmt:d.fmt, def:d.def });
    });
    out.sort((a, b) => b.gain - a.gain);
    return { base, now, levers: out };
  }

  /* ---- FIND CONSTRAINT --------------------------------------------------- */
  function constraint(periodId) {
    const a = assess(periodId);
    const { levers, now } = leverImpact(periodId);
    const weakPillar = a.pillars.filter(p => p.score != null).sort((x, y) => x.score - y.score)[0] || null;

    // Money first: the biggest gap that is also genuinely below par.
    const money = levers.find(l => l.score != null && l.score < 75) || levers[0] || null;

    // Fallback when the model has nothing to chew on: worst scored metric.
    let worst = null;
    Schema.METRICS.forEach(d => {
      const s = a.scores[d.id];
      if (s == null) return;
      if (!worst || s * d.weight < worst.score * worst.def.weight) worst = { def:d, score:s, value:a.metrics[d.id] };
    });

    const chosen = money
      ? { metricId:money.metricId, label:money.label, pillar:money.pillar, score:money.score,
          current:money.current, target:money.target, fmt:money.fmt, gain:money.gain, def:money.def }
      : worst
      ? { metricId:worst.def.id, label:worst.def.label, pillar:worst.def.pillar, score:worst.score,
          current:worst.value, target:Store.benchmark(worst.def.id).target, fmt:worst.def.fmt,
          gain:0, def:worst.def.def }
      : null;

    return { assessment:a, weakPillar, constraint:chosen, levers, projection:now };
  }

  /* ---- Benchmarks table -------------------------------------------------- */
  function benchmarkRow(metricId, periodId) {
    const d = Schema.metric(metricId), b = Store.benchmark(metricId);
    const cur = metricsFor(periodId).metrics[metricId];
    const prevId = Store.previousId(periodId);
    const prev = prevId ? metricsFor(prevId).metrics[metricId] : null;
    const hist = Store.periodIds().map(id => metricsFor(id).metrics[metricId]).filter(v => v != null);
    const trail = n => { const v = Store.trailing(periodId, n).map(p => metricsFor(p.id).metrics[metricId]).filter(x => x != null);
      return v.length ? v.reduce((a, x) => a + x, 0) / v.length : null; };
    const best = hist.length ? (d.dir === 'down' ? Math.min(...hist) : Math.max(...hist)) : null;
    const score = scoreOf(metricId, cur);
    const delta = (cur != null && prev != null && prev !== 0) ? (cur - prev) / Math.abs(prev) : null;
    return { def:d, current:cur, previous:prev, delta, target:b.target, floor:b.floor,
             best, avg3:trail(3), avg6:trail(6), score, band:band(score), history:hist };
  }

  /* ---- ALERTS ------------------------------------------------------------ */
  function alerts(periodId) {
    const a = assess(periodId), out = [];
    const push = (level, title, body, metricId) => out.push({ level, title, body, metricId });

    // Trend breaks — a fall matters more than a low absolute number.
    Schema.METRICS.forEach(d => {
      const r = benchmarkRow(d.id, periodId);
      if (r.current == null || r.previous == null || r.delta == null) return;
      const worse = d.dir === 'down' ? r.delta > 0 : r.delta < 0;
      const mag = Math.abs(r.delta);
      if (!worse || mag < 0.15) return;
      const line = `${Schema.fmt(r.previous, d.fmt)} → ${Schema.fmt(r.current, d.fmt)} (${(r.delta*100).toFixed(0)}%)`;
      if (mag >= 0.25 && r.score != null && r.score < 60) push('red', `${d.label} fell hard`, line, d.id);
      else if (mag >= 0.15) push('amber', `${d.label} is sliding`, line, d.id);
    });

    // Hard economic gates.
    const m = a.metrics;
    if (m.ltvCac != null && m.ltvCac < 3)
      push(m.ltvCac < 2 ? 'red' : 'amber', 'LTV:CAC below 3',
           `${Schema.fmt(m.ltvCac,'x')} — you are buying customers at a price the product does not repay.`, 'ltvCac');
    if (m.capacityUse != null && m.capacityUse > 1)
      push('red', 'Delivery is over capacity',
           `${Schema.fmt(m.capacityUse,'pct')} of leader capacity. Results fall before anyone reports it.`, 'capacityUse');
    if (m.collectionRate != null && m.collectionRate < 0.7) {
      const gap = (a.inputs.grossSigned || 0) - (a.inputs.cashCollected || 0);
      push('red', 'Signed revenue is not becoming cash',
           `${Schema.fmt(m.collectionRate,'pct')} collected — ${Schema.yen(gap)} signed but not banked.`, 'collectionRate');
    }
    if (m.day14Rate != null && m.day14Rate < 0.5)
      push('amber', 'Day-14 implementation is low',
           `${Schema.fmt(m.day14Rate,'pct')}. Students who have not acted by day 14 rarely produce a day-90 result.`, 'day14Rate');
    if (m.opProfit != null && m.opProfit < 0)
      push('red', 'Operating loss', `${Schema.yen(m.opProfit)} this period.`, 'opProfit');
    if (m.lineBlockRate != null && m.lineBlockRate > 0.05)
      push('amber', 'LINE block rate climbing', `${Schema.fmt(m.lineBlockRate,'pct')} of reachable friends left.`, 'lineBlockRate');
    if (m.proofRate != null && m.proofRate < 0.3 && m.successRate != null && m.successRate > 0.2)
      push('amber', 'Results are not becoming proof',
           `${Schema.fmt(m.proofRate,'pct')} of verified results have a case study. Unshown proof sells nothing.`, 'proofRate');

    // Data quality — the weakness that makes every other number arguable.
    if (a.completeness.pct < 0.8)
      push('info', 'The record is incomplete',
           `${a.completeness.filled}/${a.completeness.total} fields entered. Missing lead-source and funnel fields make the rates below unreliable.`, null);

    const rank = { red:0, amber:1, info:2 };
    return out.sort((x, y) => rank[x.level] - rank[y.level]);
  }

  /* ---- PEOPLE ANALYTICS -------------------------------------------------- */
  const OUTCOME_ORDER = ['none','implemented','firstClient','result100k','result300k','result1m'];
  const OUTCOME_LABEL = { none:'No result', implemented:'Implemented', firstClient:'First client',
                          result100k:'¥100K+', result300k:'¥300K+', result1m:'¥1M+' };

  const ltvOf = p => (p.collected || 0) - (p.refunded || 0)
    + (p.networkMonths || 0) * (p.networkFee || 0) + (p.expansion || 0);

  const days = (a, b) => (a && b) ? Math.round((new Date(b) - new Date(a)) / 86400000) : null;

  function groupBy(list, keyFn) {
    const g = {};
    list.forEach(p => { const k = keyFn(p) || '—'; (g[k] = g[k] || []).push(p); });
    return g;
  }
  function segmentTable(keyFn) {
    const customers = Store.people().filter(p => p.datePurchase);
    const g = groupBy(customers, keyFn);
    return Object.keys(g).map(k => {
      const rows = g[k], ltvs = rows.map(ltvOf);
      const succ = rows.filter(p => OUTCOME_ORDER.indexOf(p.outcome) >= 2).length;
      return { key:k, n:rows.length,
               ltvAvg: ltvs.reduce((a, b) => a + b, 0) / rows.length,
               ltvMedian: median(ltvs),
               successRate: succ / rows.length,
               networkRate: rows.filter(p => p.network === 'joined').length / rows.length,
               refundRate: rows.reduce((a, p) => a + (p.refunded || 0), 0) /
                           Math.max(1, rows.reduce((a, p) => a + (p.collected || 0), 0)),
               revenue: rows.reduce((a, p) => a + (p.collected || 0), 0) };
    }).sort((a, b) => b.ltvMedian - a.ltvMedian);
  }

  /* Does the thesis hold — do customers who get results pay more over time? */
  function ltvByResult() {
    const customers = Store.people().filter(p => p.datePurchase);
    return OUTCOME_ORDER.map(o => {
      const rows = customers.filter(p => p.outcome === o);
      if (!rows.length) return { key:OUTCOME_LABEL[o], outcome:o, n:0 };
      const ltvs = rows.map(ltvOf);
      return { key:OUTCOME_LABEL[o], outcome:o, n:rows.length,
               ltvMedian: median(ltvs),
               ltvAvg: ltvs.reduce((a, b) => a + b, 0) / rows.length,
               networkRate: rows.filter(p => p.network === 'joined').length / rows.length,
               referrals: rows.reduce((a, p) => a + (p.referrals || 0), 0) / rows.length };
    });
  }

  function timeToResult() {
    const c = Store.people().filter(p => p.datePurchase);
    const set = f => c.map(f).filter(v => v != null && v >= 0);
    const stat = a => a.length ? { n:a.length, p25:pct(a,.25), median:median(a), p75:pct(a,.75), best:Math.min(...a) } : null;
    return {
      firstClient: stat(set(p => days(p.datePurchase, p.dateFirstClient))),
      firstResult: stat(set(p => days(p.datePurchase, p.dateFirstResult))),
      leadToSale:  stat(set(p => days(p.dateLead, p.datePurchase))),
    };
  }

  /* Section 50/51 — intervene on day 14, not day 90. */
  function riskScore(p, todayISO) {
    const today = todayISO || Store.todayISO();
    const flags = [];
    const since = days(p.datePurchase, today);
    if (p.datePurchase) {
      if (since > 14 && p.outcome === 'none') flags.push('No implementation past day 14');
      if (since > 90 && OUTCOME_ORDER.indexOf(p.outcome) < 2) flags.push('Past day 90 with no economic result');
      if ((p.collected || 0) < (p.price || 0) * 0.5 && since > 60) flags.push('Payments behind');
    }
    if (p.network === 'joined') {
      if ((p.referrals || 0) === 0 && (p.networkMonths || 0) >= 3) flags.push('3+ months in Network, zero referrals');
      if (OUTCOME_ORDER.indexOf(p.outcome) < 2) flags.push('Paying monthly without a result — churn risk');
    }
    if (p.status === 'active' && !p.leader) flags.push('No leader assigned');
    (p.riskFlags || []).forEach(f => flags.push(f));
    const score = Math.min(100, flags.length * 25);
    return { flags, score, band: score >= 75 ? 'red' : score >= 40 ? 'amber' : 'green' };
  }
  function atRisk() {
    return Store.people()
      .map(p => ({ person:p, risk:riskScore(p) }))
      .filter(r => r.risk.flags.length)
      .sort((a, b) => b.risk.score - a.risk.score);
  }

  return { LOOP, LEVERS, OUTCOME_ORDER, OUTCOME_LABEL,
           metricsFor, scoreOf, band, assess, completeness,
           baseline, project, leverImpact, constraint, benchmarkRow, alerts,
           ltvOf, segmentTable, ltvByResult, timeToResult, riskScore, atRisk,
           median, pct };
})();

      w:'Aggregates hide the segment that is actually broken.', o:'Ops', h:'1 month' },
  ];

  /* ---- TRACK: judge an intervention on the evidence, not on effort ------- */
  function review(x, periodId) {
    const d = Schema.metric(x.metricId);
    const now = Engine.metricsFor(periodId).metrics[x.metricId];
    if (now == null || x.baseline == null) return { verdict:'unknown', now, delta:null };
    const raw = now - x.baseline;
    const good = d.dir === 'down' ? -raw : raw;
    const rel = x.baseline ? good / Math.abs(x.baseline) : null;
    const verdict = rel == null ? 'unknown' : rel >= 0.1 ? 'worked' : rel <= -0.1 ? 'worse' : 'no-effect';
    return { verdict, now, delta:raw, rel };
  }

  const VERDICT_LABEL = { worked:'Worked', 'no-effect':'No effect', worse:'Made it worse', unknown:'Not enough data' };

/* ============================================================================
   seed.js — SYNTHETIC demo data.

   Not KNCT's numbers. Invented, deterministic, and clearly labelled, so the
   screens can be judged before a single real number has been collected.
   Loading it wipes local data; "Clear demo" puts you back to empty.
   ========================================================================== */

const Seed = (() => {
  // deterministic PRNG — same demo every time, so screenshots stay comparable
  let s = 20260601;
  const rnd  = () => (s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296;
  const between = (a, b) => a + rnd() * (b - a);
  const iRand = (a, b) => Math.round(between(a, b));
  const pick = a => a[Math.floor(rnd() * a.length)];

  const MONTHS = ['2026-02','2026-03','2026-04','2026-05','2026-06','2026-07'];
  const SOURCES = ['YJK Instagram','KNCT University IG','KNCT Consulting','LINE','Referral','Run club','Event','Paid ads'];
  const REPS = ['Yuya','Bianca','Sho'];
  const LEADERS = ['Bianca','Kenta','Mika'];

    Store.reset();
    Store.setCompany({ name:'KNCT (demo)', cadence:'month' });

    MONTHS.forEach((id, i) => {
      const g = 1 + i * 0.12;                       // the business is growing

      const leads = Math.round(views * between(0.004, 0.008) * (1 + i * 0.05));
      const apps  = Math.round(leads * between(0.14, 0.22));
      const qual  = Math.round(apps * between(0.45, 0.62));

        views, reach:Math.round(views * 0.42), profileVisits:Math.round(views * between(0.012,0.02)),

        lineMessagesSent:iRand(5, 10), lineFriendsNew:iRand(500, 1100),
        lineTargetReach:5200 + i * 420, lineBlocks:iRand(150, 320),
        leads, leadsReferral:Math.round(leads * between(0.05, 0.14)),
        applications:apps, applicationsQual:qual, meetingsBooked:booked, meetingsAttended:att,
        sales, grossSigned:signed,
        cashCollected:Math.round(signed * between(0.45, 0.72)) + iRand(600000, 1400000),

    Store.setNotes(MONTHS[MONTHS.length - 1],
