<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0a0e14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="VALUE LOOP" />
  <title>VALUE LOOP OS — the operating system that tells a business what to fix next</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand"><span class="logo">◍</span> VALUE LOOP <em id="coName">—</em></div>
      <div id="scorePill" class="phase-pill" role="button" tabindex="0">—</div>
    </header>

    <main id="view"><!-- rendered by ui.js --></main>

    <nav id="tabbar">
      <button class="tab" data-tab="company">  <span class="ic">◍</span><span>Company</span></button>
      <button class="tab" data-tab="acquire">  <span class="ic">◉</span><span>Acquire</span></button>
      <button class="tab" data-tab="success">  <span class="ic">✦</span><span>Success</span></button>
      <button class="tab" data-tab="retain">   <span class="ic">∞</span><span>Retain</span></button>
      <button class="tab" data-tab="diagnose"> <span class="ic">⚑</span><span>Diagnose</span></button>
      <button class="tab" data-tab="data">     <span class="ic">▤</span><span>Data</span></button>
    </nav>
  </div>

  <div id="modalRoot"></div>

  <script src="js/schema.js"></script>
  <script src="js/store.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/prescribe.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
